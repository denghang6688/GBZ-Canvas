<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置中心</title>
    <script src="/static/vendor/js/lucide.js?v=V26.10.27.3.1790042522"></script>
    <script src="/static/js/theme.js?v=V26.10.27.3.1790042521"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=V26.10.27.1.1790042522');

        * { box-sizing:border-box; }
        html, body { margin:0; min-height:100%; background:#121722; color:#eef2f7; font-family:Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
        body { overflow:auto; }
        .settings-page { width:min(1040px, calc(100% - 56px)); margin:0 auto; padding:44px 0 56px; }
        .settings-head { margin-bottom:24px; }
        .settings-kicker { display:flex; align-items:center; gap:8px; color:#8ea0ba; font-size:12px; font-weight:760; }
        .settings-title { margin:8px 0 8px; font-size:28px; line-height:1.15; font-weight:880; color:#f8fafc; }
        .settings-sub { margin:0; color:#94a3b8; font-size:13px; font-weight:650; }
        .settings-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
        .setting-card {
            min-height:148px;
            padding:18px;
            border-radius:14px;
            border:0;
            background:#1b2230;
            color:#eef2f7;
            text-align:left;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            gap:12px;
            box-shadow:0 16px 42px rgba(0,0,0,.18);
            transition:background .16s ease, transform .16s ease;
        }
        .setting-card:hover { transform:translateY(-1px); background:#20293a; }
        .setting-card-panel { cursor:default; }
        .setting-card-panel:hover { transform:none; background:#1b2230; }
        .setting-card-main { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
        .setting-card-copy strong { color:#e6f7ff; font-weight:850; }
        .setting-switch { position:relative; width:48px; height:28px; flex:0 0 48px; display:inline-flex; cursor:pointer; }
        .setting-switch input { position:absolute; opacity:0; width:0; height:0; }
        .setting-switch span { position:absolute; inset:0; border-radius:999px; background:#0f1724; border:1px solid rgba(148,163,184,.24); transition:background .16s ease, border-color .16s ease; }
        .setting-switch span::after { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; border-radius:50%; background:#7d8aa0; transition:transform .16s ease, background .16s ease; box-shadow:0 4px 12px rgba(0,0,0,.24); }
        .setting-switch input:checked + span { background:#30d5ff; border-color:#30d5ff; }
        .setting-switch input:checked + span::after { transform:translateX(20px); background:#061018; }
        .setting-switch input:disabled + span { opacity:.55; cursor:not-allowed; }
        .setting-actions { margin-top:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .setting-mini-btn { height:32px; padding:0 12px; border-radius:9px; border:1px solid rgba(48,213,255,.42); background:rgba(48,213,255,.12); color:#e8faff; font-size:12px; font-weight:820; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
        .setting-mini-btn:hover { background:rgba(48,213,255,.2); border-color:#30d5ff; }
        .setting-mini-btn:disabled { opacity:.55; cursor:not-allowed; }
        .setting-state { min-height:18px; color:#8ea0ba; font-size:11.5px; line-height:1.45; font-weight:650; }
        .setting-range-row { margin-top:auto; display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; }
        .setting-range-row input[type="range"] { width:100%; accent-color:#30d5ff; }
        .setting-range-value { min-width:48px; height:28px; padding:0 10px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; background:#30d5ff; color:#061018; font-size:12px; font-weight:900; }
        .setting-card-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#111827; background:#f4f7fb; }
        .setting-card-title { font-size:16px; font-weight:850; color:#f8fafc; }
        .setting-card-copy { margin:0; color:#a8b3c5; font-size:12px; line-height:1.55; font-weight:620; }
        .setting-card-foot { margin-top:auto; display:flex; align-items:center; gap:7px; color:#d7dde8; font-size:12px; font-weight:780; }
        .settings-note { margin-top:18px; padding:12px 14px; border-radius:12px; background:#151b25; border:1px solid rgba(148,163,184,.14); color:#8793a6; font-size:12px; font-weight:650; }
        html:not(.theme-dark):not(.theme-custom), html:not(.theme-dark):not(.theme-custom) body { background:#f6f8fb; color:#1f2329; }
        html:not(.theme-dark):not(.theme-custom) .settings-title,
        html:not(.theme-dark):not(.theme-custom) .setting-card-title { color:#1f2329; }
        html:not(.theme-dark):not(.theme-custom) .setting-card { background:#fff; color:#1f2329; box-shadow:0 16px 42px rgba(31,35,41,.08); }
        html:not(.theme-dark):not(.theme-custom) .setting-card:hover { background:#f1f4f8; }
        html:not(.theme-dark):not(.theme-custom) .setting-card-panel:hover { background:#fff; }
        html:not(.theme-dark):not(.theme-custom) .setting-card-copy strong { color:#0f172a; }
        html:not(.theme-dark):not(.theme-custom) .setting-switch span { background:#e8edf4; border-color:#d5dde8; }
        html:not(.theme-dark):not(.theme-custom) .setting-switch span::after { background:#94a3b8; }
        html:not(.theme-dark):not(.theme-custom) .setting-mini-btn { background:#effaff; color:#07556b; border-color:#a5e8f7; }
        html:not(.theme-dark):not(.theme-custom) .setting-range-value { background:#0ea5c8; color:#effaff; }
        html:not(.theme-dark):not(.theme-custom) .setting-state { color:#64748b; }
        html:not(.theme-dark):not(.theme-custom) .settings-note { background:#fff; border-color:#e2e8f0; color:#64748b; }
        html.theme-custom, html.theme-custom body { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 8%, #080b10); color:#f5fbff; }
        html.theme-custom .settings-title { color:#f5fbff; }
        html.theme-custom .settings-kicker { color:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 78%, #ffffff); }
        html.theme-custom .settings-sub,
        html.theme-custom .setting-card-copy,
        html.theme-custom .settings-note { color:#b7d8e4; }
        html.theme-custom .setting-card-icon { background:var(--studio-custom-color, #7c5cff); color:#061018; }
        html.theme-custom .setting-card { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 7%, #111722); color:#f5fbff; border:1px solid color-mix(in srgb, var(--studio-custom-color, #7c5cff) 28%, #25262b); box-shadow:0 18px 44px rgba(0,0,0,.18); }
        html.theme-custom .setting-card:hover { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 14%, #111722); border-color:var(--studio-custom-color, #7c5cff); }
        html.theme-custom .setting-card-panel:hover { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 7%, #111722); }
        html.theme-custom .setting-switch input:checked + span { background:var(--studio-custom-color, #7c5cff); border-color:var(--studio-custom-color, #7c5cff); }
        html.theme-custom .setting-mini-btn { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 14%, transparent); border-color:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 46%, #ffffff); color:#f5fbff; }
        html.theme-custom .setting-range-row input[type="range"] { accent-color:var(--studio-custom-color, #7c5cff); }
        html.theme-custom .setting-range-value { background:var(--studio-custom-color, #7c5cff); color:#061018; }
        html.theme-custom .setting-card-title,
        html.theme-custom .setting-card-foot { color:#f5fbff; }
        html.theme-custom .settings-note { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 7%, #111722); border-color:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 28%, #25262b); }
        @media (max-width:760px) {
            .settings-page { width:calc(100% - 28px); padding:24px 0 36px; }
            .settings-grid { grid-template-columns:1fr; }
            .settings-title { font-size:24px; }
        }

        /* Monochrome settings page: no blue theme accents, no framed outer boundary. */
        :root,
        html.theme-dark,
        body.theme-dark,
        html.theme-custom,
        body.theme-custom {
            --settings-bg:#050505;
            --settings-card:#1f1f1f;
            --settings-card-hover:#252525;
            --settings-text:#f4f4f4;
            --settings-muted:#a6a6a6;
            --settings-line:#333333;
            --settings-strong:#f4f4f4;
            --settings-strong-text:#080808;
        }
        html:not(.theme-dark):not(.theme-custom),
        html:not(.theme-dark):not(.theme-custom) body {
            --settings-bg:#f7f7f7;
            --settings-card:#ffffff;
            --settings-card-hover:#eeeeee;
            --settings-text:#111111;
            --settings-muted:#5f5f5f;
            --settings-line:#d6d6d6;
            --settings-strong:#111111;
            --settings-strong-text:#ffffff;
        }
        html,
        body {
            background:var(--settings-bg) !important;
            color:var(--settings-text) !important;
        }
        .settings-page {
            background:transparent !important;
        }
        .settings-kicker,
        .settings-sub,
        .setting-card-copy,
        .setting-state,
        .settings-note {
            color:var(--settings-muted) !important;
        }
        .settings-title,
        .setting-card-title,
        .setting-card-copy strong,
        .setting-card-foot {
            color:var(--settings-text) !important;
        }
        .setting-card,
        html.theme-custom .setting-card,
        html:not(.theme-dark):not(.theme-custom) .setting-card {
            background:var(--settings-card) !important;
            color:var(--settings-text) !important;
            border:0 !important;
            box-shadow:none !important;
        }
        .setting-card:hover,
        .setting-card-panel:hover,
        html.theme-custom .setting-card:hover,
        html:not(.theme-dark):not(.theme-custom) .setting-card:hover {
            background:var(--settings-card-hover) !important;
        }
        .setting-card-icon,
        html.theme-custom .setting-card-icon {
            background:var(--settings-strong) !important;
            color:var(--settings-strong-text) !important;
        }
        .setting-mini-btn,
        html.theme-custom .setting-mini-btn,
        html:not(.theme-dark):not(.theme-custom) .setting-mini-btn {
            background:transparent !important;
            border-color:var(--settings-line) !important;
            color:var(--settings-text) !important;
            box-shadow:none !important;
        }
        .setting-mini-btn:hover {
            background:var(--settings-strong) !important;
            border-color:var(--settings-strong) !important;
            color:var(--settings-strong-text) !important;
        }
        .setting-switch input:checked + span,
        html.theme-custom .setting-switch input:checked + span {
            background:var(--settings-strong) !important;
            border-color:var(--settings-strong) !important;
        }
        .setting-switch input:checked + span::after {
            background:var(--settings-strong-text) !important;
        }
        .setting-range-row input[type="range"],
        html.theme-custom .setting-range-row input[type="range"] {
            accent-color:var(--settings-strong) !important;
        }
        .setting-range-value,
        html.theme-custom .setting-range-value,
        html:not(.theme-dark):not(.theme-custom) .setting-range-value {
            background:var(--settings-strong) !important;
            color:var(--settings-strong-text) !important;
        }
        .settings-note,
        html.theme-custom .settings-note,
        html:not(.theme-dark):not(.theme-custom) .settings-note {
            background:transparent !important;
            border-color:var(--settings-line) !important;
        }
    </style>
</head>
<body>
    <main class="settings-page">
        <header class="settings-head">
            <div class="settings-kicker"><i data-lucide="settings" class="w-4 h-4"></i><span>GBZ Studio</span></div>
            <h1 class="settings-title">设置中心</h1>
            <p class="settings-sub">集中管理接口、工作流、语言和画布辅助设置。</p>
        </header>

        <section class="settings-grid" aria-label="设置入口">
            <button class="setting-card" type="button" data-switch-page="api-settings">
                <span class="setting-card-icon"><i data-lucide="key-round" class="w-5 h-5"></i></span>
                <span class="setting-card-title">API 设置</span>
                <p class="setting-card-copy">管理平台地址、模型列表、Key 和推荐 API。</p>
                <span class="setting-card-foot">进入设置 <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
            </button>

            <button class="setting-card" type="button" data-switch-page="comfyui-settings">
                <span class="setting-card-icon"><i data-lucide="workflow" class="w-5 h-5"></i></span>
                <span class="setting-card-title">工作流设置</span>
                <p class="setting-card-copy">配置 ComfyUI、工作流和本地生成相关参数。</p>
                <span class="setting-card-foot">进入设置 <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
            </button>

            <button class="setting-card" type="button" data-switch-page="canvas" data-open-trash="1">
                <span class="setting-card-icon"><i data-lucide="trash-2" class="w-5 h-5"></i></span>
                <span class="setting-card-title">管理回收站</span>
                <p class="setting-card-copy">查看已删除的画布，按需恢复或彻底清理。</p>
                <span class="setting-card-foot">打开回收站 <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
            </button>

            <div class="setting-card setting-card-panel" id="frameOpacityCard">
                <div class="setting-card-main">
                    <div style="min-width:0;display:flex;flex-direction:column;gap:12px">
                        <span class="setting-card-icon"><i data-lucide="scan-line" class="w-5 h-5"></i></span>
                        <span class="setting-card-title">画布框不透明度</span>
                    </div>
                    <span id="frameOpacityValue" class="setting-range-value">56%</span>
                </div>
                <p class="setting-card-copy">调节组合框和工作流框的背景强度。只影响框的填充，不会让图片、文字和连线一起变淡。</p>
                <div class="setting-range-row">
                    <input id="frameOpacityRange" type="range" min="0" max="0.85" step="0.05" value="0.56" aria-label="画布框不透明度">
                    <span id="frameOpacityHint" class="setting-state">当前：56%</span>
                </div>
            </div>

            <div class="setting-card setting-card-panel" id="comfyAutoStartCard">
                <div class="setting-card-main">
                    <div style="min-width:0;display:flex;flex-direction:column;gap:12px">
                        <span class="setting-card-icon"><i data-lucide="power" class="w-5 h-5"></i></span>
                        <span class="setting-card-title">ComfyUI 自动启动</span>
                    </div>
                    <label class="setting-switch" title="启动画布后自动启动 ComfyUI 后台">
                        <input id="comfyAutoStartSwitch" type="checkbox" aria-label="启动画布后自动启动 ComfyUI 后台">
                        <span></span>
                    </label>
                </div>
                <p class="setting-card-copy">默认关闭。开启后，下次启动画布会自动检测并拉起本机 ComfyUI；分享给别人时，把 ComfyUI 放在画布目录旁边即可复用。</p>
                <div class="setting-actions">
                    <button id="comfyStartNowBtn" class="setting-mini-btn" type="button"><i data-lucide="play" class="w-3.5 h-3.5"></i><span>立即启动</span></button>
                    <button class="setting-mini-btn" type="button" data-switch-page="comfyui-settings"><i data-lucide="workflow" class="w-3.5 h-3.5"></i><span>后端地址</span></button>
                </div>
                <div id="comfyAutoStartState" class="setting-state">正在检查 ComfyUI 状态...</div>
            </div>

            <div class="setting-card setting-card-panel" id="translateModelCard">
                <div class="setting-card-main">
                    <div style="min-width:0;display:flex;flex-direction:column;gap:12px">
                        <span class="setting-card-icon"><i data-lucide="languages" class="w-5 h-5"></i></span>
                        <span class="setting-card-title">默认翻译大模型</span>
                    </div>
                </div>
                <p class="setting-card-copy">手写节点点击"文A"翻译时，优先使用此处选择的 API 大模型；未设置则沿用节点自身模型。</p>
                <div class="setting-actions">
                    <select id="translateProviderSelect" class="setting-mini-btn" style="min-width:140px;justify-content:flex-start" aria-label="翻译平台"></select>
                    <select id="translateModelSelect" class="setting-mini-btn" style="min-width:180px;justify-content:flex-start" aria-label="翻译模型"></select>
                    <button id="translateModelClearBtn" class="setting-mini-btn" type="button"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>清除</span></button>
                </div>
                <div id="translateModelState" class="setting-state">未设置，使用节点默认模型</div>
            </div>

        </section>

        <div class="settings-note">这里是统一入口，具体配置仍复用现有页面，避免重复维护。</div>
    </main>

    <script>
        function switchStudioPage(btn){
            window.parent.postMessage({ type:'studio-switch-page', page:btn.dataset.switchPage, openTrash:btn.dataset.openTrash === '1' }, '*');
        }
        document.querySelectorAll('[data-switch-page]').forEach(btn => {
            btn.addEventListener('click', () => switchStudioPage(btn));
        });

        const FRAME_OPACITY_KEY = 'smart_canvas_frame_opacity';
        const FRAME_OPACITY_DEFAULT = 0.56;
        const frameOpacityRange = document.getElementById('frameOpacityRange');
        const frameOpacityValue = document.getElementById('frameOpacityValue');
        const frameOpacityHint = document.getElementById('frameOpacityHint');
        function normalizeFrameOpacity(value){
            if(value === null || value === undefined || value === '') return FRAME_OPACITY_DEFAULT;
            const next = Number(value);
            if(!Number.isFinite(next)) return FRAME_OPACITY_DEFAULT;
            return Math.round(Math.max(0, Math.min(0.85, next)) * 100) / 100;
        }
        function frameOpacityLabel(value){
            return `${Math.round(normalizeFrameOpacity(value) * 100)}%`;
        }
        function readFrameOpacity(){
            try {
                const stored = localStorage.getItem(FRAME_OPACITY_KEY);
                return stored === null ? FRAME_OPACITY_DEFAULT : normalizeFrameOpacity(stored);
            } catch(e){
                return FRAME_OPACITY_DEFAULT;
            }
        }
        function renderFrameOpacitySetting(value=readFrameOpacity()){
            const next = normalizeFrameOpacity(value);
            if(frameOpacityRange) frameOpacityRange.value = String(next);
            if(frameOpacityValue) frameOpacityValue.textContent = frameOpacityLabel(next);
            if(frameOpacityHint) frameOpacityHint.textContent = `当前：${frameOpacityLabel(next)}`;
        }
        function saveFrameOpacity(value){
            const next = normalizeFrameOpacity(value);
            try { localStorage.setItem(FRAME_OPACITY_KEY, String(next)); } catch(e) {}
            renderFrameOpacitySetting(next);
            window.parent.postMessage({ type:'studio-set-frame-opacity', opacity:next }, '*');
        }
        frameOpacityRange?.addEventListener('input', () => saveFrameOpacity(frameOpacityRange.value));
        window.addEventListener('message', event => {
            if(event.origin && event.origin !== location.origin) return;
            if(event.data?.type === 'studio-frame-opacity') renderFrameOpacitySetting(event.data.opacity);
        });
        window.addEventListener('storage', event => {
            if(event.key === FRAME_OPACITY_KEY) renderFrameOpacitySetting(event.newValue);
        });
        renderFrameOpacitySetting();

        const comfySwitch = document.getElementById('comfyAutoStartSwitch');
        const comfyState = document.getElementById('comfyAutoStartState');
        const comfyStartBtn = document.getElementById('comfyStartNowBtn');

        function setComfyState(text){ comfyState.textContent = text || ''; }
        async function comfyJson(res, fallback='请求失败'){
            let data = {};
            try { data = await res.json(); } catch(e) {}
            if(!res.ok){
                if(res.status === 404) throw new Error('后台接口未加载，请重启画布服务后再试');
                throw new Error(data.detail || data.error || fallback);
            }
            return data;
        }
        function describeComfyState(data){
            if(!data) return '无法读取 ComfyUI 状态';
            if(data.running) return `已连接：${data.addr || 'ComfyUI 后台'}`;
            if(data.launch_available) return `未运行，可启动入口：${data.launch_source || '已配置'}`;
            return '未找到启动入口：请把 ComfyUI 放在画布目录旁边，或在 API/.env 配置 COMFYUI_DIR / COMFYUI_START_COMMAND';
        }

        async function loadComfyAutoStart(){
            if(!comfySwitch || !comfyState) return;
            try {
                const data = await fetch('/api/comfyui/autostart').then(r => comfyJson(r, '读取自动启动设置失败'));
                comfySwitch.checked = !!data.enabled;
                setComfyState(describeComfyState(data));
            } catch(e){
                setComfyState('读取自动启动设置失败');
            }
        }

        comfySwitch?.addEventListener('change', async () => {
            comfySwitch.disabled = true;
            setComfyState('保存中...');
            try {
                const res = await fetch('/api/comfyui/autostart', {
                    method:'PUT',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ enabled: comfySwitch.checked })
                });
                const data = await comfyJson(res, '保存失败');
                comfySwitch.checked = !!data.enabled;
                setComfyState(`${data.enabled ? '已开启' : '已关闭'}。${describeComfyState(data)}`);
            } catch(e){
                comfySwitch.checked = !comfySwitch.checked;
                setComfyState(e.message || '保存失败');
            } finally {
                comfySwitch.disabled = false;
            }
        });

        comfyStartBtn?.addEventListener('click', async () => {
            comfyStartBtn.disabled = true;
            setComfyState('正在启动 ComfyUI 后台...');
            try {
                const res = await fetch('/api/comfyui/start', { method:'POST' });
                const data = await comfyJson(res, '启动失败');
                if(data.error) throw new Error(data.error);
                setComfyState(data.message || (data.already_running ? 'ComfyUI 已在运行' : 'ComfyUI 已发送启动命令'));
                setTimeout(loadComfyAutoStart, 3500);
            } catch(e){
                setComfyState(e.message || '启动失败');
            } finally {
                comfyStartBtn.disabled = false;
            }
        });

        loadComfyAutoStart();

        // ===== 默认翻译大模型设置 =====
        const TRANSLATE_PROVIDER_KEY = 'smart_translate_provider';
        const TRANSLATE_MODEL_KEY = 'smart_translate_model';
        const translateProviderSelect = document.getElementById('translateProviderSelect');
        const translateModelSelect = document.getElementById('translateModelSelect');
        const translateModelState = document.getElementById('translateModelState');
        const translateModelClearBtn = document.getElementById('translateModelClearBtn');
        let translateProviders = [];

        function translateChatProviders(){
            return (translateProviders || []).filter(p => p.enabled !== false && Array.isArray(p.chat_models) && p.chat_models.length);
        }
        function renderTranslateProviderOptions(){
            if(!translateProviderSelect) return;
            const providers = translateChatProviders();
            const saved = localStorage.getItem(TRANSLATE_PROVIDER_KEY) || '';
            const selected = providers.some(p => p.id === saved) ? saved : (providers[0]?.id || '');
            translateProviderSelect.innerHTML = providers.map(p =>
                `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${p.name || p.id}</option>`
            ).join('');
            renderTranslateModelOptions();
        }
        function renderTranslateModelOptions(){
            if(!translateModelSelect || !translateProviderSelect) return;
            const providerId = translateProviderSelect.value;
            const provider = translateChatProviders().find(p => p.id === providerId);
            const models = [...new Set((provider?.chat_models || []).filter(Boolean))];
            const saved = localStorage.getItem(TRANSLATE_MODEL_KEY) || '';
            const selected = models.includes(saved) ? saved : (models[0] || '');
            translateModelSelect.innerHTML = models.map(m =>
                `<option value="${m}" ${m === selected ? 'selected' : ''}>${m}</option>`
            ).join('');
            updateTranslateModelState();
        }
        function updateTranslateModelState(){
            if(!translateModelState) return;
            const providerId = translateProviderSelect?.value || '';
            const model = translateModelSelect?.value || '';
            const provider = translateChatProviders().find(p => p.id === providerId);
            if(providerId && model){
                translateModelState.textContent = `当前：${provider?.name || providerId} · ${model}`;
            } else {
                translateModelState.textContent = '未设置，使用节点默认模型';
            }
        }
        function saveTranslateModel(){
            const providerId = translateProviderSelect?.value || '';
            const model = translateModelSelect?.value || '';
            if(providerId) localStorage.setItem(TRANSLATE_PROVIDER_KEY, providerId);
            if(model) localStorage.setItem(TRANSLATE_MODEL_KEY, model);
            updateTranslateModelState();
        }
        translateProviderSelect?.addEventListener('change', () => { renderTranslateModelOptions(); saveTranslateModel(); });
        translateModelSelect?.addEventListener('change', saveTranslateModel);
        translateModelClearBtn?.addEventListener('click', () => {
            localStorage.removeItem(TRANSLATE_PROVIDER_KEY);
            localStorage.removeItem(TRANSLATE_MODEL_KEY);
            renderTranslateProviderOptions();
        });
        async function loadTranslateProviders(){
            try {
                const cfg = await fetch('/api/config', {cache:'no-store'}).then(r => r.json());
                translateProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
                renderTranslateProviderOptions();
            } catch(e) {
                if(translateModelState) translateModelState.textContent = '加载平台列表失败，请刷新重试';
            }
        }
        loadTranslateProviders();

        if(window.lucide) lucide.createIcons();
    </script>
