        .skill-form { border:1px solid var(--chat-line); border-radius:12px; padding:12px; margin-bottom:8px; background:var(--chat-panel-2); }
        .skill-form input, .skill-form textarea {
            width:100%; box-sizing:border-box; border:1px solid var(--chat-line-2); border-radius:8px;
            background:var(--chat-panel); color:var(--chat-text); font-size:12px; padding:8px 10px; margin-bottom:8px;
            font-family:inherit; resize:vertical;
        }
        .skill-form textarea { min-height:84px; }
        .skill-form-actions { display:flex; gap:8px; justify-content:flex-end; }
        .skill-install-card {
            margin-top:10px; border:1px dashed var(--chat-line-2); border-radius:12px; padding:10px 12px;
            background:var(--chat-panel-2); font-size:12px; color:var(--chat-text);
        }
        .skill-install-card .sic-head { display:flex; align-items:center; gap:8px; font-weight:600; }
        .skill-install-card .sic-head svg { width:14px; height:14px; }
        .skill-install-card .sic-desc { color:var(--chat-muted); margin:4px 0 8px; }
        .skill-install-card .sic-btn {
            border:0; border-radius:8px; background:var(--chat-text); color:var(--chat-panel);
            font-size:12px; padding:6px 12px; cursor:pointer;
        }
        .skill-install-card .sic-btn:disabled { opacity:.6; cursor:default; }

        /* ===== 2026-09-20 底栏裁剪修复：不依赖网格行计算，锚定定位 ===== */
        html.chat-embed .composer-body {
            position:relative !important;
            max-height:calc(var(--embed-composer-h, 246px) - 36px) !important;
            overflow:hidden !important;
        }
        html.chat-embed .composer-inside-foot {
            position:absolute !important;
            left:0 !important;
            right:0 !important;
            bottom:0 !important;
            z-index:5 !important;
        }
        html.chat-embed textarea#messageInput {
            max-height:calc(var(--embed-composer-h, 246px) - 110px) !important;
        }
        /* 半屏（layout=half）模式：模型选择器完整显示，不截断 */
        html.chat-embed.chat-wide .model-picker {
            width:min(400px, 100%) !important;
            max-width:400px !important;
            min-width:220px !important;
        }
        html.chat-embed.chat-wide .model-picker-model {
            font-size:13px !important;
        }
        html.chat-embed.chat-wide .model-picker-model::before {
            content:"默认模型 · " !important;
            font-size:12px !important;
        }
        /* 窄面板（480px 侧栏）：空间有限，去掉"默认 · "前缀，完整显示模型名 */
        html.chat-embed .model-picker-model {
            font-size:12px !important;
            letter-spacing:0 !important;
        }
        html.chat-embed .model-picker-model::before {
            content:"" !important;
        }
        /* ===== 2026-09-20 头部收起按钮并入按钮行：修复与父页面悬浮 × 重叠 ===== */
        /* 收起 × 现在是 .top-actions 内的普通按钮（chatEmbedCollapseBtn），随行内 gap 排列；
           旧版为父页面悬浮 × 预留的 70px 右内边距不再需要，恢复与左侧对称的 14px。 */
        html.chat-embed .topbar {
            padding-right:14px !important;
        }
        html.chat-embed .top-actions .chat-embed-collapse {
            display:flex !important;
            align-items:center !important;
            justify-content:center !important;
        }
        /* ===== 2026-09-20 ModelScope 风格配色（只改颜色）：近黑蓝底 + 紫色主色 ===== */
        html.chat-embed body,
        html.chat-embed .chat-shell,
        html.chat-embed .chat-main,
        html.chat-embed .topbar-inner,
        html.chat-embed .messages,
        html.chat-embed .agent-empty,
        html.chat-embed .composer-wrap {
            --chat-bg:#0d0d0d !important;
            --chat-panel:#161616 !important;
            --chat-panel-2:#1c1c1c !important;
            --chat-soft:#1c1c1c !important;
            --chat-line:#252525 !important;
            --chat-line-2:#2f2f2f !important;
            --chat-text:#eaeaea !important;
            --chat-muted:#9c9c9c !important;
            --chat-strong:#7c6cf0 !important;
            --chat-strong-text:#ffffff !important;
        }
        html.chat-embed body,
        html.chat-embed .chat-shell,
        html.chat-embed .chat-main,
        html.chat-embed .topbar,
        html.chat-embed .messages {
            background:#0d0d0d !important;
            background-color:#0d0d0d !important;
        }
        html.chat-embed .topbar {
            border-bottom:1px solid #1c1c1c !important;
        }
        html.chat-embed .action-btn {
            background:#161616 !important;
            background-color:#161616 !important;
            color:#c8c8c8 !important;
            border:1px solid #252525 !important;
        }
        html.chat-embed .action-btn:hover {
            background:#1c1c1c !important;
            background-color:#1c1c1c !important;
            color:#ffffff !important;
            border-color:#3c3c3c !important;
        }
        html.chat-embed .bubble,
        html.chat-embed .composer,
        html.chat-embed .agent-quick-row button,
        html.chat-embed .model-picker,
        html.chat-embed .skill-picker-item {
            border-color:#252525 !important;
        }
        html.chat-embed .agent-quick-row button {
            background:#161616 !important;
            background-color:#161616 !important;
            color:#c8c8c8 !important;
        }
        html.chat-embed .agent-quick-row button:hover {
            background:#1c1c1c !important;
            background-color:#1c1c1c !important;
            border-color:#3c3c3c !important;
        }
        /* 发送按钮 → 蓝紫实心 */
        html.chat-embed .send-button,
        html.chat-embed .composer-send,
        html.chat-embed .send-btn {
            background:#7c6cf0 !important;
            background-color:#7c6cf0 !important;
            color:#fff !important;
        }
        html.chat-embed .send-btn:hover {
            background:#968bf7 !important;
            background-color:#968bf7 !important;
        }
        /* 输入区底部工具按钮 → 蓝灰 */
        html.chat-embed .upload-btn,
        html.chat-embed .skill-menu-btn,
        html.chat-embed .model-picker-button {
            background:rgba(28,28,28,.92) !important;
            background-color:rgba(28,28,28,.92) !important;
            color:#c8c8c8 !important;
            border-color:#2b2b2b !important;
        }
        /* 模型选择 / 技能选择等子菜单弹层 → 蓝灰面板 + 紫色选中态 */
        html.chat-embed .model-picker-popover,
        html.chat-embed #modelPickerPopover,
        html.chat-embed .skill-picker,
        html.chat-embed .resolution-picker-popover {
            background:#121212 !important;
            background-color:#121212 !important;
            border-color:#2b2b2b !important;
        }
        html.chat-embed .model-picker-scope .active,
        html.chat-embed .model-picker-scope button.active {
            background:#7c6cf0 !important;
            background-color:#7c6cf0 !important;
            color:#ffffff !important;
        }
        html.chat-embed .model-picker-item:hover,
        html.chat-embed .skill-picker-item:hover,
        html.chat-embed .model-picker-item.model-picker-item-active {
            background:#1c1c1c !important;
            background-color:#1c1c1c !important;
        }
        /* 技能胶囊等原蓝色强调 → 蓝紫 */
        html.chat-embed .composer-skill-chip,
        html.chat-embed .skill-toast {
            color:#9d8bff !important;
            border-color:rgba(124,108,240,.45) !important;
            background:rgba(124,108,240,.12) !important;
        }
        /* ===== 2026-10-12 大标题蓝紫渐变（与入口球同色系：蓝→紫） ===== */
        html.chat-embed .title-block h1,
        html.chat-embed .title-block h1::after {
            color:transparent !important;
            background:linear-gradient(92deg,#8ab0ff 0%,#7c6cf0 55%,#5b3fd6 100%) !important;
            -webkit-background-clip:text !important;
            background-clip:text !important;
        }
        /* ===== 2026-09-20 气泡最终样式（置于样式表末尾，覆盖前面所有同名规则）
           2026-09-20 晚更新：按用户要求，所有对话消息统一带气泡
           2026-09-20 深夜更新：内边距收紧；用户气泡随内容自适应、整体靠右，换行左对齐 ===== */
        html.chat-embed body .bubble,
        html.chat-embed body .bubble.assistant,
        html.studio-theme-dark body .bubble.assistant,
        html.theme-dark body .bubble.assistant {
            background:#202020 !important;
            background-color:#202020 !important;
            border:1px solid #343434 !important;
            box-shadow:none !important;
            padding:9px 12px !important;
            max-width:min(680px, 88%) !important;
            border-radius:14px !important;
            border-bottom-left-radius:6px !important;
            font-size:14px !important;
            line-height:1.75 !important;
            text-align:left !important;
        }
        html.chat-embed body .bubble.assistant.has-copy { padding-top:34px !important; }
        html.chat-embed body .bubble.assistant .bubble-text { color:#e6e6e6 !important; }
        html.chat-embed body .bubble.user,
        html.studio-theme-dark body .bubble.user,
        html.theme-dark body .bubble.user {
            background:#2c2c2c !important;
            background-color:#2c2c2c !important;
            border:0 !important;
            box-shadow:none !important;
            /* 2026-09-20 深夜：按用户要求每行最多 25 字换行。
               宽度 = min(整行文字宽, 25em + 内边距)，短句贴右、满 25 字才换行；
               不再用 fit-content（在 flex 行里会被压塌成竖排）。 */
            width:max-content !important;
            max-width:min(96%, calc(25em + 24px)) !important;
            min-width:0 !important;
            flex:0 0 auto !important;
            padding:6px 10px !important;
            border-radius:11px !important;
            border-bottom-right-radius:4px !important;
            font-size:13.5px !important;
            line-height:1.7 !important;
            color:#f6f6f6 !important;
            /* break-word（而非 anywhere）：不会把 min-content 压到单字，避免短句被逐字竖排 */
            overflow-wrap:break-word !important;
            word-break:normal !important;
            text-align:left !important;
            align-self:flex-end !important;
        }
        html.chat-embed body .bubble.image-bubble,
        html.studio-theme-dark body .bubble.image-bubble,
        html.theme-dark body .bubble.image-bubble {
            background:#202020 !important;
            background-color:#202020 !important;
            border:1px solid #343434 !important;
            border-radius:14px !important;
            padding:10px !important;
            max-width:min(600px, 86%) !important;
        }
    </style>
</head>
<body>
    <div class="chat-shell">
        <main class="chat-main">
            <header class="topbar">
                <div class="topbar-inner">
                    <div class="title-block">
                        <h1 id="chatTitle" data-i18n="chat.newConversation">新对话</h1>
                    </div>
                    <div class="top-actions">
                        <button onclick="event.stopPropagation();newConversation()" class="action-btn" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus"></i><span data-i18n="chat.new">新建</span></button>
                        <button onclick="event.stopPropagation();toggleSystemPrompt()" class="action-btn" title="系统提示词" style="display:none !important"><i data-lucide="sliders-horizontal"></i><span>系统</span></button>
                        <aside id="systemPromptPopover" class="system-prompt-popover" onclick="event.stopPropagation()">
                            <div class="system-prompt-head">
                                <div class="system-prompt-title">系统提示词</div>
                                <button onclick="event.stopPropagation();toggleSystemPrompt(false)" class="rail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                            </div>
                            <textarea id="systemPromptInput" class="system-prompt-textarea" placeholder="例如：你是一个专业图片创作助手，回答要简洁，并优先给出可执行步骤。"></textarea>
                            <div class="system-prompt-actions">
                                <button type="button" onclick="clearSystemPrompt()">清空</button>
                                <button type="button" class="primary" onclick="saveSystemPromptFromUI()">保存</button>
                            </div>
                        </aside>
                        <button onclick="event.stopPropagation();toggleHistory()" class="action-btn history-toggle" title="历史对话" data-i18n-title="chat.history"><i data-lucide="history"></i><span data-i18n="chat.history">历史</span></button>
                        <aside id="historyPopover" class="chat-rail">
                            <div class="rail-head">
                                <div>
                                    <div class="rail-kicker" data-i18n="chat.historyTitle">Conversations</div>
                                    <div class="rail-title" data-i18n="chat.history">历史</div>
                                </div>
                                <button onclick="event.stopPropagation();toggleHistory(false)" class="rail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                            </div>
                            <button onclick="event.stopPropagation();newConversation()" class="rail-new" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus"></i><span data-i18n="chat.new">新建</span></button>
                            <div id="threadList" class="thread-list"></div>
                        </aside>
                        <button onclick="event.stopPropagation();toggleChatFullscreen()" class="action-btn chat-fullscreen-toggle" title="全屏对话"><i data-lucide="maximize-2"></i><span>全屏</span></button>
                        <button id="chatEmbedCollapseBtn" class="action-btn chat-embed-collapse" title="收起面板" hidden onclick="event.stopPropagation();collapseEmbedPanel()"><i data-lucide="x"></i></button>
                    </div>
                </div>
            </header>

            <section id="messages" class="messages"></section>

            <div class="composer-wrap">
                <div id="skillPicker" class="skill-picker hidden" onclick="event.stopPropagation()"></div>
                <div id="activeSkillBar" class="active-skill-bar hidden"></div>
                <div class="composer">
                    <div id="composerBody" class="composer-body">
                        <div id="composerSkillChip" class="composer-skill-chip hidden" onclick="event.stopPropagation()"></div>
                        <textarea id="messageInput" rows="4" placeholder="输入消息，Enter 发送..." data-i18n-placeholder="chat.inputPlaceholder" oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                        <div id="refStrip" class="ref-strip"></div>
                        <div class="composer-inside-foot">
                            <div class="left-tools">
                                <div class="inline-controls">
                                    <input id="attachmentInput" class="file-input" type="file" multiple onchange="uploadFiles(this.files); this.value='';">
                                    <button type="button" class="upload-btn" onclick="document.getElementById('attachmentInput')?.click()" title="上传附件" aria-label="上传附件">
                                        <i data-lucide="paperclip"></i>
                                    </button>
                                    <button type="button" class="skill-menu-btn" onclick="toggleSkillModal()" title="技能包（输入 / 快速加载）" aria-label="技能包">
                                        <i data-lucide="sparkles"></i>
                                    </button>
                                    <div id="modelPicker" class="model-picker">
                                        <button id="modelPickerBtn" class="model-picker-button" onclick="event.stopPropagation();toggleModelPicker()" title="选择平台和模型">
                                            <i data-lucide="boxes"></i>
                                            <span class="model-picker-labels">
                                                <span id="modelPickerProvider" class="model-picker-provider">API</span>
                                                <span class="model-picker-dot"></span>
                                                <span id="modelPickerModel" class="model-picker-model">Model</span>
                                            </span>
                                            <i data-lucide="chevron-up"></i>
                                        </button>
                                        <div id="modelPickerPopover" class="model-picker-popover" onclick="event.stopPropagation()">
                                            <div class="model-picker-head">
                                                <div id="modelPickerTitle" class="model-picker-title">模型选择</div>
                                                <div id="modelPickerScope" class="model-picker-scope"></div>
                                            </div>
                                            <div class="model-picker-body">
                                                <div id="modelProviderList" class="model-picker-list"></div>
                                                <div id="modelList" class="model-picker-list"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="imageControls" class="image-controls hidden">
                                        <div id="resolutionPicker" class="resolution-picker" title="比例和分辨率">
                                            <button id="resolutionPickerBtn" class="resolution-picker-button" onclick="event.stopPropagation();toggleResolutionPicker()" title="比例和分辨率">
                                                <i data-lucide="ruler"></i>
                                                <span class="resolution-picker-labels">
                                                    <span id="resolutionPickerType" class="resolution-picker-type">尺寸</span>
                                                    <span class="resolution-picker-dot"></span>
                                                    <span id="resolutionPickerValue" class="resolution-picker-value">自动</span>
                                                </span>
                                                <i data-lucide="chevron-up"></i>
                                            </button>
                                            <div id="resolutionPickerPopover" class="resolution-picker-popover" onclick="event.stopPropagation()">
                                                <div class="resolution-picker-head">
                                                    <div class="resolution-picker-title">尺寸选择</div>
                                                    <div id="resolutionPickerScope" class="resolution-picker-scope">
                                                        <button id="resolutionScopeAuto" type="button" class="active" onclick="setResolutionPickerScope('auto')">自动</button>
                                                        <button id="resolutionScopePreset" type="button" onclick="setResolutionPickerScope('preset')">内置尺寸</button>
                                                        <button id="resolutionScopeCustom" type="button" onclick="setResolutionPickerScope('custom')">自定义</button>
                                                    </div>
                                                </div>
                                                <div id="resolutionAutoPane" class="resolution-picker-pane custom">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自动尺寸</div>
                                                        <div class="resolution-custom-hint">默认 1024x1024；提示词包含比例或明确尺寸时自动匹配。</div>
                                                    </div>
                                                </div>
                                                <div id="resolutionPresetPane" class="resolution-picker-pane preset hidden">
                                                    <div id="resolutionRatioList" class="resolution-picker-list">
                                                        <button id="chat-ratio-square" type="button" class="resolution-picker-option active" onclick="selectBuiltInRatio('square')"><span>1:1</span><small>正方形</small></button>
                                                        <button id="chat-ratio-portrait" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('portrait')"><span>2:3</span><small>竖图</small></button>
                                                        <button id="chat-ratio-landscape" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('landscape')"><span>3:2</span><small>横图</small></button>
                                                        <button id="chat-ratio-portrait43" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('portrait43')"><span>3:4</span><small>竖图</small></button>
                                                        <button id="chat-ratio-landscape43" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('landscape43')"><span>4:3</span><small>横图</small></button>
                                                        <button id="chat-ratio-4:5" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('4:5')"><span>4:5</span><small>竖图</small></button>
                                                        <button id="chat-ratio-5:4" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('5:4')"><span>5:4</span><small>横图</small></button>
                                                        <button id="chat-ratio-story" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('story')"><span>9:16</span><small>竖屏</small></button>
                                                        <button id="chat-ratio-wide" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('wide')"><span>16:9</span><small>宽屏</small></button>
                                                        <button id="chat-ratio-21:9" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('21:9')"><span>21:9</span><small>超宽</small></button>
                                                        <button id="chat-ratio-9:21" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('9:21')"><span>9:21</span><small>超竖</small></button>
                                                        <div class="resolution-picker-divider">以下为模型独有比例</div>
                                                        <button id="chat-ratio-2:1" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('2:1')"><span>2:1</span><small>仅GPT</small></button>
                                                        <button id="chat-ratio-1:2" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('1:2')"><span>1:2</span><small>仅GPT</small></button>
                                                        <button id="chat-ratio-3:1" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('3:1')"><span>3:1</span><small>仅GPT</small></button>
                                                        <button id="chat-ratio-1:3" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('1:3')"><span>1:3</span><small>仅GPT</small></button>
                                                        <button id="chat-ratio-4:1" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('4:1')"><span>4:1</span><small>仅Pro</small></button>
                                                        <button id="chat-ratio-1:4" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('1:4')"><span>1:4</span><small>仅Pro</small></button>
                                                    </div>
                                                    <div id="resolutionLevelList" class="resolution-picker-list">
                                                        <button type="button" class="resolution-picker-option" data-resolution="1k" onclick="selectResolutionPreset('1k')"><span>1K</span><small id="resolutionPreset1k">1024x1024</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="2k" onclick="selectResolutionPreset('2k')"><span>2K</span><small id="resolutionPreset2k">1536x1536</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="4k" onclick="selectResolutionPreset('4k')"><span>4K</span><small id="resolutionPreset4k">2048x2048</small></button>
                                                    </div>
                                                </div>
                                                <div id="resolutionCustomPane" class="resolution-picker-pane custom hidden">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自定义分辨率</div>
                                                        <div class="resolution-custom-row">
                                                            <input id="customResolutionWidth" type="number" min="256" max="8192" step="1" placeholder="宽">
                                                            <span>x</span>
                                                            <input id="customResolutionHeight" type="number" min="256" max="8192" step="1" placeholder="高">
                                                            <button type="button" onclick="applyCustomResolution()">应用</button>
                                                        </div>
                                                        <div id="customResolutionHint" class="resolution-custom-hint">输入 256-8192 之间的宽度和高度</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button id="sendBtn" onclick="sendMessage()" class="send-btn" title="发送" data-i18n-title="chat.send"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="skillModalMask" class="skill-modal-mask hidden" onclick="if(event.target===this) toggleSkillModal(false)">
        <div class="skill-modal">
            <div class="skill-modal-head">
                <div class="skill-modal-title">技能包</div>
                <button class="skill-modal-close" onclick="toggleSkillModal(false)" aria-label="关闭"><i data-lucide="x"></i></button>
            </div>
            <div class="skill-modal-body" id="skillModalBody"></div>
        </div>
    </div>
    <div id="imagePreviewModal" class="image-preview-modal" onclick="closeImagePreview()">
        <button class="image-preview-close" title="关闭" aria-label="关闭" onclick="event.stopPropagation();closeImagePreview()"><i data-lucide="x"></i></button>
        <img id="imagePreviewImg" src="" alt="preview" onclick="event.stopPropagation()">
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            if(event.data?.type === 'smart-canvas-agent-refs') addCanvasRefsToComposer(event.data.refs || [], event.data.options || {});
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });
        window.addEventListener('resize', () => {
            if(document.getElementById('modelPicker')?.classList.contains('open')) positionModelPicker();
            if(document.getElementById('resolutionPicker')?.classList.contains('open')) positionResolutionPicker();
        });
        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const CHAT_SETTINGS_KEY = 'gpt_chat_settings_v1';
        const CHAT_LAST_CONVERSATION_KEY = 'gpt_chat_last_conversation_v1';
        const CHAT_ATTACHMENT_MAX = 20;
        const CHAT_SIZE_MODE_VERSION = 2;
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);
        // 半屏/放大模式（画布浮层传入 layout=half）：模型选择器等需要更宽的展示空间
        try {
            if(new URLSearchParams(location.search).get('layout') === 'half') {
                document.documentElement.classList.add('chat-wide');
            }
        } catch(e) {}

        function readChatSettings(){
            try {
                const raw = localStorage.getItem(CHAT_SETTINGS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e) {
                return {};
            }
        }

        function isObject(value){
            return value && typeof value === 'object' && !Array.isArray(value);
        }

        const savedChatSettings = readChatSettings();
        // 比例键全集：共用在前，GPT 独有 / 香蕉 Pro 独有在后（与面板注释一致）；须在 chatRatio 初始化前声明
        const CHAT_RATIO_KEYS = ['square','portrait','portrait43','landscape43','landscape','story','wide','4:5','5:4','21:9','9:21','2:1','1:2','3:1','1:3','4:1','1:4'];
        let conversations = [];
        let currentConversation = null;
        let mode = 'agent';
        let provider = savedChatSettings.provider || 'comfly';
        let msModel = savedChatSettings.msModel || '';
        let activeChatModel = savedChatSettings.activeChatModel || '';
        let activeImageProvider = savedChatSettings.activeImageProvider || 'comfly';
        let activeImageModel = savedChatSettings.activeImageModel || '';
        let systemPrompt = String(savedChatSettings.systemPrompt || '').trim();
        let apiProviders = [];
        let chatProviderModels = isObject(savedChatSettings.chatProviderModels) ? savedChatSettings.chatProviderModels : {};
        let chatRatio = CHAT_RATIO_KEYS.includes(savedChatSettings.chatRatio) ? savedChatSettings.chatRatio : 'square';
        let chatResolution = savedChatSettings.chatSizeModeVersion === CHAT_SIZE_MODE_VERSION && ['auto','1k','2k','4k','custom'].includes(savedChatSettings.chatResolution) ? savedChatSettings.chatResolution : 'auto';
        let chatPresetResolution = ['1k','2k','4k'].includes(savedChatSettings.chatPresetResolution) ? savedChatSettings.chatPresetResolution : (chatResolution === 'custom' ? '1k' : chatResolution);
        let chatCustomSize = normalizeChatCustomSize(savedChatSettings.chatCustomSize || '') || '1024x1024';
        let modelPickerScope = savedChatSettings.modelPickerScope === 'image' ? 'image' : 'chat';
        let modelPickerHome = null;
        let resolutionPickerHome = null;
        let refs = [];
        let config = { chat_model: 'gpt-5.5', image_model: 'gpt-image-2', ms_chat_models: [] };

        const SIZE_OPTIONS = {
            square: [['1024x1024','1k'], ['1536x1536','2k'], ['2048x2048','4k']],
            portrait: [['720x1080','1k'], ['1024x1536','2k'], ['1365x2048','4k']],
            portrait43: [['1008x1344','1k'], ['1536x2048','2k'], ['2448x3264','4k']],
            landscape43: [['1344x1008','1k'], ['2048x1536','2k'], ['3264x2448','4k']],
            landscape: [['1080x720','1k'], ['1536x1024','2k'], ['2048x1365','4k']],
            story: [['720x1280','1k'], ['1080x1920','2k'], ['1440x2560','4k']],
            wide: [['1280x720','1k'], ['1920x1080','2k'], ['2560x1440','4k']],
            '4:5': [['1024x1280','1k'], ['1536x1920','2k'], ['2560x3200','4k']],
            '5:4': [['1280x1024','1k'], ['1920x1536','2k'], ['3200x2560','4k']],
            '21:9': [['1344x576','1k'], ['2016x864','2k'], ['3024x1296','4k']],
            '9:21': [['576x1344','1k'], ['864x2016','2k'], ['1296x3024','4k']],
            '2:1': [['1536x768','1k'], ['2048x1024','2k'], ['3072x1536','4k']],
            '1:2': [['768x1536','1k'], ['1024x2048','2k'], ['1536x3072','4k']],
            '3:1': [['2304x768','1k'], ['3072x1024','2k'], ['3840x1280','4k']],
            '1:3': [['768x2304','1k'], ['1024x3072','2k'], ['1280x3840','4k']],
            '4:1': [['2048x512','1k'], ['3072x768','2k'], ['3840x960','4k']],
            '1:4': [['512x2048','1k'], ['768x3072','2k'], ['960x3840','4k']]
        };

        const headers = () => ({'Content-Type':'application/json', 'X-User-ID':userId});

        function rememberConversation(id){
            try {
                if(id) localStorage.setItem(CHAT_LAST_CONVERSATION_KEY, id);
                else localStorage.removeItem(CHAT_LAST_CONVERSATION_KEY);
            } catch(e) {}
        }

        function rememberedConversation(){
            try { return localStorage.getItem(CHAT_LAST_CONVERSATION_KEY) || ''; }
            catch(e) { return ''; }
        }

        function saveChatSettings(){
            try {
                localStorage.setItem(CHAT_SETTINGS_KEY, JSON.stringify({
                    mode,
                    provider,
                    msModel,
                    activeChatModel,
                    activeImageProvider,
                    activeImageModel,
                    systemPrompt,
                    chatProviderModels,
                    chatRatio,
                    chatResolution,
                    chatPresetResolution,
                    chatCustomSize,
                    modelPickerScope,
                    chatSizeModeVersion: CHAT_SIZE_MODE_VERSION
                }));
            } catch(e) {}
        }

        function syncSystemPromptUI(){
            const input = document.getElementById('systemPromptInput');
            if(input) input.value = systemPrompt || '';
        }

        function toggleSystemPrompt(force){
            const pop = document.getElementById('systemPromptPopover');
            if(!pop) return;
            const shouldOpen = typeof force === 'boolean' ? force : !pop.classList.contains('open');
            pop.classList.toggle('open', shouldOpen);
            if(shouldOpen){
                toggleHistory(false);
                syncSystemPromptUI();
                lucide.createIcons();
            }
        }

        function saveSystemPromptFromUI(){
            const input = document.getElementById('systemPromptInput');
            systemPrompt = String(input?.value || '').trim();
            saveChatSettings();
            toggleSystemPrompt(false);
        }

        function clearSystemPrompt(){
            systemPrompt = '';
            const input = document.getElementById('systemPromptInput');
            if(input) input.value = '';
            saveChatSettings();
        }

        function currentSystemPrompt(){
            const pop = document.getElementById('systemPromptPopover');
            const input = document.getElementById('systemPromptInput');
            const value = pop?.classList.contains('open') && input ? input.value : systemPrompt;
            const base = String(value || '').trim();
            const parts = [base];
            if(activeSkill && activeSkill.content){
                parts.push(`【已加载技能包：${activeSkill.name}】\n下面是该技能包的完整说明（SKILL.md）。处理用户本轮请求时，严格遵循此技能包的工作流程、输出格式与约束：\n\n${activeSkill.content}`);
            }
            parts.push(skillsSystemPromptSuffix());
            return parts.filter(Boolean).join('\n\n').trim();
        }

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function chatProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (p.chat_models || []).length);
            if(config.ms_chat_models?.length && !list.some(p => p.id === 'modelscope')) list.push({id:'modelscope', name:'ModelScope', chat_models:config.ms_chat_models, image_models:[]});
            return list.length ? list : [{id:'comfly', name:'API', chat_models:[config.chat_model || 'gpt-4o-mini'], image_models:[config.image_model || 'gpt-image-2']}];
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (p.image_models || []).length);
            return list.length ? list : [{id:'comfly', name:'API', image_models:[config.image_model || 'gpt-image-2'], chat_models:[config.chat_model || 'gpt-4o-mini']}];
        }
        function providerById(id, kind='chat'){
            const list = kind === 'image' ? imageProviders() : chatProviders();
            return list.find(p => p.id === id) || list[0];
        }
        function activePickerKind(){
            return mode === 'image' ? 'image' : (mode === 'agent' ? modelPickerScope : 'chat');
        }
        function currentProviderId(kind=activePickerKind()){
            return kind === 'image' ? activeImageProvider : provider;
        }
        function modelListForCurrent(kind=activePickerKind()){
            const item = providerById(currentProviderId(kind), kind);
            return uniqueModels(kind === 'image' ? item.image_models : item.chat_models);
        }
        function currentModel(kind=activePickerKind()){
            return kind === 'image' ? activeImageModel : (provider === 'modelscope' ? (msModel || activeChatModel) : activeChatModel);
        }
        function providerNameById(id, kind=activePickerKind()){
            const item = providerById(id, kind);
            return item?.name || item?.id || 'API';
        }
        function shortModelName(value){
            return String(value || '').split('/').pop().split(':')[0] || 'Model';
        }
        function renderProviderControls(){
            const kind = activePickerKind();
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            const pid = currentProviderId(kind);
            if(!providers.some(p => p.id === pid)) {
                if(kind === 'image') activeImageProvider = providers[0]?.id || 'comfly';
                else provider = providers[0]?.id || 'comfly';
            }
            const models = modelListForCurrent(kind);
            if(kind === 'image' && !models.includes(activeImageModel)) activeImageModel = models[0] || config.image_model;
            if(kind !== 'image' && !models.includes(activeChatModel)) activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || config.chat_model);
            if(kind !== 'image' && provider === 'modelscope') msModel = activeChatModel;
            renderModelPicker();
        }

        function validateSavedProviderState(){
            const chatProviderList = chatProviders();
            provider = chatProviderList.some(p => p.id === provider) ? provider : (chatProviderList[0]?.id || 'comfly');
            const chatModels = uniqueModels(providerById(provider, 'chat')?.chat_models || []);
            const rememberedChatModel = chatProviderModels[provider];
            activeChatModel = chatModels.includes(activeChatModel)
                ? activeChatModel
                : (chatModels.includes(rememberedChatModel) ? rememberedChatModel : (chatModels[0] || config.chat_model));
            chatProviderModels[provider] = activeChatModel;
            if(provider === 'modelscope') msModel = activeChatModel;
            if(config.ms_chat_models?.length && msModel && !config.ms_chat_models.includes(msModel)) msModel = config.ms_chat_models[0];
            if(config.ms_chat_models?.length && provider === 'modelscope') activeChatModel = msModel || config.ms_chat_models[0];

            const imageProviderList = imageProviders();
            activeImageProvider = imageProviderList.some(p => p.id === activeImageProvider) ? activeImageProvider : (imageProviderList[0]?.id || 'comfly');
            const imageModels = uniqueModels(providerById(activeImageProvider, 'image')?.image_models || []);
            activeImageModel = imageModels.includes(activeImageModel) ? activeImageModel : (imageModels[0] || config.image_model);
            if(mode !== 'agent' && mode !== 'chat' && mode !== 'image') mode = 'chat';
            if(mode === 'chat') modelPickerScope = 'chat';
            if(mode === 'image') modelPickerScope = 'image';
        }

        async function loadConfig(){
            try {
                const data = await fetch('/api/config').then(r=>r.json());
                config = { ...config, ...data };
                apiProviders = Array.isArray(config.api_providers) ? config.api_providers : [];
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                config.image_model = config.image_model || ((config.image_models || [])[0]) || 'gpt-image-2';
                validateSavedProviderState();
                setMode(mode, false);
                updateModelLabel();
                saveChatSettings();
            } catch(e) {}
        }
        try {
            const apiChannel = new BroadcastChannel('studio-api');
            apiChannel.onmessage = async (e) => {
                if(e.data?.type === 'providers-changed'){
                    await loadConfig();
                    renderProviderControls();
                    updateModelLabel();
                }
            };
        } catch(e) {}

        function setProvider(p, kind=activePickerKind()) {
            if(kind === 'image') activeImageProvider = p;
            else provider = p;
            const models = modelListForCurrent(kind);
            if(kind === 'image') activeImageModel = models[0] || activeImageModel;
            else {
                activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || activeChatModel);
                if(provider === 'modelscope') msModel = activeChatModel;
            }
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }
        function setActiveModel(model, kind=activePickerKind()){
            if(kind === 'image') activeImageModel = model;
            else {
                activeChatModel = model;
                chatProviderModels[provider] = model;
                if(provider === 'modelscope') msModel = model;
            }
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }

        function toggleModelPicker(force){
            const picker = document.getElementById('modelPicker');
            const pop = document.getElementById('modelPickerPopover');
            const shouldOpen = typeof force === 'boolean' ? force : !picker.classList.contains('open');
            picker.classList.toggle('open', shouldOpen);
            pop?.classList.toggle('open', shouldOpen);
            if(shouldOpen) {
                toggleResolutionPicker(false);
                if(pop && pop.parentElement !== document.body) {
                    modelPickerHome = picker;
                    document.body.appendChild(pop);
                }
                if(mode === 'image') modelPickerScope = 'image';
                if(mode === 'chat') modelPickerScope = 'chat';
                renderModelPicker();
                positionModelPicker();
                lucide.createIcons();
            } else if(pop && modelPickerHome && pop.parentElement === document.body) {
                modelPickerHome.appendChild(pop);
            }
        }

        function positionModelPicker(){
            const btn = document.getElementById('modelPickerBtn');
            const pop = document.getElementById('modelPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = Math.min(460, Math.max(380, viewportW - 28));
            const estimatedHeight = Math.min(390, Math.max(260, viewportH * .62));
            const availableAbove = Math.max(180, rect.top - 14);
            const maxHeight = Math.min(390, availableAbove, viewportH - 32);
            const left = Math.min(Math.max(16, rect.left), Math.max(16, viewportW - width - 16));
            const top = Math.max(12, rect.top - maxHeight - 10);
            pop.style.setProperty('--model-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(16, top))}px`);
            pop.style.setProperty('--model-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--model-picker-max-height', `${Math.round(maxHeight)}px`);
            requestAnimationFrame(() => {
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--model-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }
        function toggleResolutionPicker(force){
            const picker = document.getElementById('resolutionPicker');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!picker) return;
            const shouldOpen = typeof force === 'boolean' ? force : !picker.classList.contains('open');
            picker.classList.toggle('open', shouldOpen);
            pop?.classList.toggle('open', shouldOpen);
            if(shouldOpen){
                toggleModelPicker(false);
                if(pop && pop.parentElement !== document.body){
                    resolutionPickerHome = picker;
                    document.body.appendChild(pop);
                }
                updateChatResolutionUI();
                positionResolutionPicker();
                lucide.createIcons();
            } else if(pop && resolutionPickerHome && pop.parentElement === document.body){
                resolutionPickerHome.appendChild(pop);
            }
        }

        function positionResolutionPicker(){
            const btn = document.getElementById('resolutionPickerBtn');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const desiredWidth = chatResolution === 'auto' ? 300 : (chatResolution === 'custom' ? 340 : 420);
            const width = Math.min(desiredWidth, Math.max(260, viewportW - 32));
            const safeX = 12;
            const safeTop = 12;
            const safeBottom = 18;
            const gap = 10;
            const left = Math.min(Math.max(safeX, rect.left + rect.width / 2 - width / 2), Math.max(safeX, viewportW - width - safeX));
            const availableAbove = Math.max(96, rect.top - safeTop - gap);
            const initialHeight = Math.min(chatResolution === 'auto' ? 220 : 390, availableAbove, viewportH - safeTop - safeBottom);
            const initialTop = Math.max(safeTop, rect.top - initialHeight - gap);
            pop.style.setProperty('--resolution-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--resolution-picker-top', `${Math.round(initialTop)}px`);
            pop.style.setProperty('--resolution-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--resolution-picker-max-height', `${Math.round(initialHeight)}px`);
            pop.style.setProperty('--resolution-picker-list-height', '320px');
            requestAnimationFrame(() => {
                const naturalHeight = Math.ceil(pop.scrollHeight || pop.getBoundingClientRect().height || 160);
                const maxHeight = Math.max(96, Math.min(naturalHeight, availableAbove, viewportH - safeTop - safeBottom));
                const headHeight = Math.ceil(pop.querySelector('.resolution-picker-head')?.getBoundingClientRect().height || 50);
                const listHeight = Math.max(58, maxHeight - headHeight - 20);
                const top = Math.max(safeTop, rect.top - maxHeight - gap);
                pop.style.setProperty('--resolution-picker-max-height', `${Math.round(maxHeight)}px`);
                pop.style.setProperty('--resolution-picker-list-height', `${Math.round(listHeight)}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(top)}px`);
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--resolution-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }

        function setModelPickerScope(kind){
            modelPickerScope = kind === 'image' ? 'image' : 'chat';
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }

        function renderModelPicker(){
            const kind = activePickerKind();
            const picker = document.getElementById('modelPicker');
            const scope = document.getElementById('modelPickerScope');
            const providerList = document.getElementById('modelProviderList');
            const modelList = document.getElementById('modelList');
            const providerLabel = document.getElementById('modelPickerProvider');
            const modelLabel = document.getElementById('modelPickerModel');
            const title = document.getElementById('modelPickerTitle');
            if(!picker || !scope || !providerList || !modelList) return;
            const currentPid = currentProviderId(kind);
            const currentMdl = currentModel(kind);
            providerLabel.textContent = providerNameById(currentPid, kind);
            if(mode === 'agent') {
                modelLabel.textContent = `${shortModelName(activeChatModel)} + ${shortModelName(activeImageModel)}`;
            } else {
                modelLabel.textContent = shortModelName(currentMdl);
            }
            title.textContent = mode === 'agent' ? 'Agent 模型' : (kind === 'image' ? '生图模型' : '对话模型');
            scope.innerHTML = mode === 'agent'
                ? `<button class="${kind === 'chat' ? 'active' : ''}" onclick="setModelPickerScope('chat')">对话</button><button class="${kind === 'image' ? 'active' : ''}" onclick="setModelPickerScope('image')">图像</button>`
                : '';
            scope.style.display = mode === 'agent' ? 'flex' : 'none';
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            providerList.innerHTML = providers.length
                ? providers.map(p => `<button class="model-picker-option ${p.id === currentPid ? 'active' : ''}" onclick="setProvider('${escapeHtml(p.id)}','${kind}')"><span>${escapeHtml(p.name || p.id)}</span>${p.id === currentPid ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无平台</div>`;
            const models = modelListForCurrent(kind);
            modelList.innerHTML = models.length
                ? models.map(m => `<button class="model-picker-option ${m === currentMdl ? 'active' : ''}" onclick="setActiveModel('${escapeHtml(m)}','${kind}');toggleModelPicker(false)"><span>${escapeHtml(shortModelName(m))}</span>${m === currentMdl ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无模型</div>`;
            lucide.createIcons();
        }

        async function loadConversations(){
            const data = await fetch('/api/conversations', {headers:{'X-User-ID':userId}}).then(r=>r.json());
            conversations = data.conversations || [];
            renderThreads();
            if(!currentConversation) {
                const rememberedId = rememberedConversation();
                const target = (rememberedId && conversations.find(item => item.id === rememberedId)) || conversations[0];
                if(target) await openConversation(target.id);
            }
            if(!currentConversation) renderMessages([]);
        }

        function renderThreads(){
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            if(!conversations.length){
                list.innerHTML = `<div class="px-3 py-8 text-center text-[11px] font-bold text-gray-300 uppercase tracking-widest">${tr('chat.noHistory')}</div>`;
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement('div');
                row.className = 'thread-row';
                const btn = document.createElement('button');
                btn.className = `thread-item ${currentConversation?.id === item.id ? 'active' : ''}`;
                btn.onclick = () => openConversation(item.id, true);

        function normalizeChatCustomSize(value){
            const match = String(value || '').trim().match(/^([1-9]\d{2,3})\s*[xX×*]\s*([1-9]\d{2,3})$/);
            if(!match) return '';
            const w = Math.round(Number(match[1]));
            const h = Math.round(Number(match[2]));
            if(w < 256 || h < 256 || w > 8192 || h > 8192) return '';
            return `${w}x${h}`;
        }

            const match = options.find(([, item]) => item === label) || options[0];
            return match[0];
        }

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|5|9|16|21)\s*:\s*(1|2|3|4|5|9|16|21)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide', '4:5':'4:5', '5:4':'5:4', '21:9':'21:9', '9:21':'9:21', '2:1':'2:1', '1:2':'1:2', '3:1':'3:1', '1:3':'1:3', '4:1':'4:1', '1:4':'1:4' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            if(chatResolution === 'custom' && !wants4k && !wants2k) return fallbackSize;
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

                const parsed = extractSkillInstalls(msg.content || '');

                    text.textContent = parsed.clean;

                }else{

                }
            }else{
                text.textContent = msg.type === 'image' ? (msg.agent_reply || tr('chat.generated')) : (msg.content || '');
            }

            bubble.appendChild(text);

            // Show model badge for assistant messages
            if(msg.role === 'assistant' && msg.model){
                const badge = document.createElement('div');
                const modelShort = msg.model.split('/').pop().split(':')[0];
                const isMs = msg.model.includes('/') && !msg.model.includes('gpt');

                badge.textContent = modelShort;

            if(bubbleInstalls.length){

            // 2026-09-20 助手消息一键复制：图标-only，气泡内部右上角（点击时读取气泡当前文本，流式输出完成后再点也能复制全文）
            if(msg.role === 'assistant' && String(msg.content || msg.agent_reply || '').trim()){
                bubble.classList.add('has-copy');
                const copyBtn = document.createElement('button');
                copyBtn.type = 'button';
                copyBtn.className = 'bubble-copy-btn';
                copyBtn.title = '复制全文';
                copyBtn.innerHTML = '<svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"/></svg>';
                copyBtn.addEventListener('click', async function(){
                    const raw = (text.innerText || text.textContent || '').trim();
                    if(!raw) return;
                    let ok = false;
                    try {
                        if(navigator.clipboard && window.isSecureContext){
                            await navigator.clipboard.writeText(raw); ok = true;
                        }
                    } catch(e) { ok = false; }
                    if(!ok){
                        try {
                            const ta = document.createElement('textarea');
                            ta.value = raw;
                            ta.style.position = 'fixed'; ta.style.opacity = '0';
                            document.body.appendChild(ta);
                            ta.select();
                            ok = document.execCommand('copy');
                            document.body.removeChild(ta);
                        } catch(e) { ok = false; }
                    }
                    if(ok){
                        copyBtn.classList.add('copied');
                        copyBtn.querySelector('.ic-copy').style.display = 'none';
                        copyBtn.querySelector('.ic-check').style.display = '';
                        setTimeout(function(){

                            copyBtn.querySelector('.ic-check').style.display = 'none';
                        }, 1500);

                });

            }
            box.appendChild(row);
            lucide.createIcons();
            return {row, bubble, text};
