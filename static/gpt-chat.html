            if(!available) return;
            const form = new FormData();
            [...files].slice(0, available).forEach(file => form.append('files', file));
            try {
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || '上传失败'); return r.json(); });
                refs.push(...(data.files || []));
                renderRefs();
            } catch(e) {
                alert(e.message || '上传失败');
            }
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            const clearButton = refs.length
                ? '<button type="button" class="ref-clear-all" onclick="clearRefs()" title="清空全部引用" aria-label="清空全部引用">×</button>'
                : '';
            // 2026-10-26（用户要求）：同类素材各自从 1 开始编号——图1/图2…、视频1/视频2…、附件1/附件2…，
            // 互不挤占，保证提示词里的 图N 始终对应第 N 张图。
            let imgSeq = 0, vidSeq = 0, fileSeq = 0;
            refs.forEach(ref => {
                if(isImageRef(ref)) ref._refLabel = `图${++imgSeq}`;
                else if(isVideoRef(ref)) ref._refLabel = `视频${++vidSeq}`;
                else ref._refLabel = `附件${++fileSeq}`;
            });
            strip.innerHTML = `${refs.map((ref,i) => renderRefChip(ref, i)).join('')}${clearButton}`;
            lucide.createIcons();
            updateComposerOverflow();
        }

        function removeRef(i){ refs.splice(i,1); renderRefs(); }
        function clearRefs(){
            if(!refs.length) return;
            refs = [];
            renderRefs();
        }

        function normalizeIncomingCanvasRef(ref){
            const url = String(ref?.url || '').trim();
            if(!url) return null;
            return {
                url,
                name:String(ref?.name || ref?.title || url.split('/').pop() || '画布引用'),
                kind:String(ref?.kind || 'image'),
                mime:String(ref?.mime || ref?.type || ''),
                role:String(ref?.role || 'canvas'),
                nodeId:String(ref?.nodeId || ''),
                nodeTitle:String(ref?.nodeTitle || ''),
                imageIndex:Number.isFinite(Number(ref?.imageIndex)) ? Number(ref.imageIndex) : -1
            };
        }

        function addCanvasRefsToComposer(nextRefs=[], options={}){
            const incoming = (Array.isArray(nextRefs) ? nextRefs : [nextRefs]).map(normalizeIncomingCanvasRef).filter(Boolean);
            if(!incoming.length) return;
            const seen = new Set(refs.map(ref => `${ref.url}|${ref.nodeId || ''}|${ref.imageIndex ?? ''}`));
            incoming.forEach(ref => {
                const key = `${ref.url}|${ref.nodeId || ''}|${ref.imageIndex ?? ''}`;
                if(refs.length < CHAT_ATTACHMENT_MAX && !seen.has(key)){
                    seen.add(key);
                    refs.push(ref);
                }
            });
            renderRefs();
            if(options.focus !== false){
                const input = document.getElementById('messageInput');
                input?.focus();
            }
        }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file').map(x => x.getAsFile()).filter(Boolean);
            if(files.length) uploadFiles(files);
        });

        const composerBody = document.getElementById('composerBody');
        composerBody.addEventListener('dragover', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.add('drag-over');
        });
        composerBody.addEventListener('dragleave', e => {
            if(!composerBody.contains(e.relatedTarget)) composerBody.classList.remove('drag-over');
        });
        composerBody.addEventListener('drop', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])];
            uploadFiles(files);
        });

        function hasUploadFiles(items){ return [...(items || [])].some(item => item.kind === 'file'); }
        function updateComposerOverflow(){
            const body = document.getElementById('composerBody');
            if(!body) return;
            body.classList.toggle('has-overflow', body.scrollHeight > body.clientHeight + 2);
        }
        function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; updateComposerOverflow(); }
        function handleKey(e){
            if(skillPickerState.open){
                if(e.key === 'ArrowDown'){ e.preventDefault(); skillPickerMove(1); return; }
                if(e.key === 'ArrowUp'){ e.preventDefault(); skillPickerMove(-1); return; }
                if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); skillPickerPick(skillPickerState.index); return; }
                if(e.key === 'Escape'){ e.preventDefault(); closeSkillPicker(); return; }
            }
            if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
        }

        /* ==================== 技能（Skills）系统 ==================== */
        let skillsData = [];
        let skillTemplates = [];
        let activeSkill = null; // 当前加载的技能包 {id,name,icon,content,hasTools}
        function skillHasTools(){
            return !!(activeSkill && activeSkill.hasTools);
        }
        const skillPickerState = { open:false, index:0, items:[], queryStart:-1 };

        async function loadSkills(){
            try{
                const data = await fetch('/api/skills').then(r => r.json());
                skillsData = Array.isArray(data.skills) ? data.skills : [];
                skillTemplates = Array.isArray(data.templates) ? data.templates : [];
            }catch(err){ skillsData = []; skillTemplates = []; }
        }

        function skillIconHtml(icon, cls){
            return `<span class="${cls}"><i data-lucide="${icon || 'sparkles'}"></i></span>`;
        }

        // —— 技能包加载 / 卸载（/ 选中后整个 SKILL.md 进入对话上下文）——
        async function activateSkill(skill){
            let pkg = { id: skill.id, name: skill.name, icon: skill.icon, content: skill.content || skill.prompt || '', hasTools: !!(Array.isArray(skill.tools) && skill.tools.length) };
            try{
                const data = await fetch(`/api/skills/${encodeURIComponent(skill.id)}`).then(r => r.json());
                if(data && data.skill){
                    const toolsCount = Array.isArray(data.skill.tools) ? data.skill.tools.length : 0;
                    pkg = { id: data.skill.id, name: data.skill.name, icon: data.skill.icon, content: data.skill.content || data.skill.prompt || '', hasTools: toolsCount > 0 };
                }
            }catch(err){ /* 拉取失败时退回列表数据 */ }
            try{
                activeSkill = pkg;
                renderActiveSkillBar();
            }catch(err){
                console.error('[skill] 渲染技能芯片失败:', err);
            }
            showSkillToast(`已加载技能包：${pkg.name}`);
        }

        function showSkillToast(text){
            let t = document.getElementById('skillToast');
            if(!t){
                t = document.createElement('div');
                t.id = 'skillToast';
                t.style.cssText = 'position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:99999;background:#1d6fe0;color:#fff;font-size:12px;padding:7px 14px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;transition:opacity .3s;opacity:0;white-space:nowrap;';
                document.body.appendChild(t);
            }
            t.textContent = text;
            t.style.opacity = '1';
            clearTimeout(showSkillToast._timer);
            showSkillToast._timer = setTimeout(()=>{ t.style.opacity = '0'; }, 1800);
        }

        function deactivateSkill(){
            activeSkill = null;
            renderActiveSkillBar();
        }

        function renderActiveSkillBar(){
            // 技能芯片渲染到输入框内部（蓝色字），旧的外部 activeSkillBar 不再使用
            const bar = document.getElementById('activeSkillBar');
            if(bar){ bar.classList.add('hidden'); bar.innerHTML = ''; }
            const chip = document.getElementById('composerSkillChip');
            if(!chip) return;
            const body = document.getElementById('composerBody');
            if(!activeSkill){
                chip.classList.add('hidden');
                chip.innerHTML = '';
                if(body) body.classList.remove('has-skill-chip');
                return;
            }
            chip.classList.remove('hidden');
            if(body) body.classList.add('has-skill-chip');
            chip.title = activeSkill.content || activeSkill.name;
            chip.innerHTML = `
                ${skillIconHtml(activeSkill.icon, 'csc-icon')}
                <span class="csc-name">${escapeHtml(activeSkill.name)}</span>
                <span class="csc-tag">Skill</span>
                <button type="button" class="csc-close" onclick="deactivateSkill()" aria-label="卸载技能包"><i data-lucide="x"></i></button>`;
            if(window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
        }

        // —— / 唤起技能选择器 ——
        function updateSkillPicker(){
            const input = document.getElementById('messageInput');
            if(!input) return;
            const caret = input.selectionStart ?? input.value.length;
            const before = input.value.slice(0, caret);
            const match = before.match(/(^|\s)\/([^\s]*)$/);
            if(!match){
                closeSkillPicker();
                return;
            }
            const query = (match[2] || '').toLowerCase();
            const pool = skillsData.filter(s => s.enabled !== false);
            const items = pool.filter(s =>
                !query || s.name.toLowerCase().includes(query) || String(s.description || '').toLowerCase().includes(query)
            ).slice(0, 12);
            skillPickerState.queryStart = caret - (match[2] || '').length - 1;
            if(!items.length){
                renderSkillPicker([], query);
                return;
            }
            skillPickerState.items = items;
            skillPickerState.index = 0;
            renderSkillPicker(items, query);
        }

        function renderSkillPicker(items, query){
            const picker = document.getElementById('skillPicker');
            if(!picker) return;
            if(!items.length){
                picker.innerHTML = `<div class="skill-picker-empty">${query ? `没有匹配 “/${query}” 的技能包` : '暂无技能包，点 ✨ 按钮安装'}</div>`;
            }else{
                picker.innerHTML = `<div class="skill-picker-head">技能包 · ↑↓ 选择 · Enter 加载 · Esc 关闭</div>` + items.map((s, i) => `
                    <button type="button" class="skill-picker-item ${i === skillPickerState.index ? 'active' : ''}" onmouseenter="skillPickerSetIndex(${i})" onmousedown="event.preventDefault();skillPickerPick(${i})" onclick="event.preventDefault();skillPickerPick(${i})">
                        ${skillIconHtml(s.icon, 'spi-icon')}
                        <span class="spi-body">
                            <span class="spi-name">${escapeHtml(s.name)}</span>
                            <span class="spi-desc">${escapeHtml(s.description || '')}</span>
                        </span>
                    </button>`).join('');
            }
            picker.classList.remove('hidden');
            skillPickerState.open = true;
        }

        function closeSkillPicker(){
            const picker = document.getElementById('skillPicker');
            if(picker) picker.classList.add('hidden');
            skillPickerState.open = false;
            skillPickerState.items = [];
        }

        function skillPickerSetIndex(i){
            // 只切换高亮类，不重建 DOM（重建会导致真实浏览器悬停时反复替换节点）
            skillPickerState.index = i;
            const picker = document.getElementById('skillPicker');
            if(!picker) return;
            picker.querySelectorAll('.skill-picker-item').forEach((el, idx) => el.classList.toggle('active', idx === i));
        }
        function skillPickerMove(dir){
            const n = skillPickerState.items.length;
            if(!n) return;
            skillPickerState.index = (skillPickerState.index + dir + n) % n;
            renderSkillPicker(skillPickerState.items, '');
            const active = document.querySelector('#skillPicker .skill-picker-item.active');
            if(active) active.scrollIntoView({block:'nearest'});
        }

        function skillPickerPick(i){
            // 防重入：mousedown + click 兜底可能连续触发两次
            if(skillPickerState.pickLock) return;
            skillPickerState.pickLock = true;
            setTimeout(()=>{ skillPickerState.pickLock = false; }, 400);
            const skill = skillPickerState.items[i];
            closeSkillPicker();
            if(!skill) return;
            const input = document.getElementById('messageInput');
            if(!input) return;
            // 技能包模式：/query 只是从输入框移除，技能包本身被“加载”进对话上下文
            const start = Math.max(0, skillPickerState.queryStart);
            const caret = input.selectionStart ?? input.value.length;
            input.value = input.value.slice(0, start) + input.value.slice(caret);
            autoGrow(input);
            input.setSelectionRange(start, start);
            input.focus();
            activateSkill(skill);
        }

        function escapeHtml(str){
            return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // —— 技能管理弹窗 ——
        // 不打 / 也能从面板直接把技能加载进当前对话（等同 / 菜单里选中）
        function addSkillFromModal(id){
            const skill = skillsData.find(s => s.id === id);
            if(!skill) return;
            if(skill.enabled === false){ showSkillToast('该技能包已停用，请先打开右侧开关再添加'); return; }
            activateSkill(skill);
            toggleSkillModal(false);
        }

        function toggleSkillModal(force){
            const mask = document.getElementById('skillModalMask');
            if(!mask) return;
            const show = force !== undefined ? force : mask.classList.contains('hidden');
            mask.classList.toggle('hidden', !show);
            if(show){ renderSkillManager(); loadSkills().then(renderSkillManager); }
        }

        function renderSkillManager(){
            const body = document.getElementById('skillModalBody');
            if(!body) return;
            const formOpen = body.dataset.formOpen || '';
            const rows = (skillsData.length ? skillsData : []).map(s => {
                const toolsCount = Array.isArray(s.tools) ? s.tools.length : 0;
                const toolsBadge = toolsCount > 0
                    ? `<span class="skill-tag" style="background:#fef3c7;color:#92400e">脚本×${toolsCount}</span>`
                    : '';
                return `
                <div class="skill-row">
                    ${skillIconHtml(s.icon, 'spi-icon')}
                    <span class="spi-body">
                        <span class="spi-name">${escapeHtml(s.name)}${s.builtin ? '<span class="skill-tag">内置</span>' : ''}${toolsBadge}</span>
                        <span class="spi-desc">${escapeHtml(s.description || '')}</span>
                    </span>
                    <span class="skill-actions">
                        <button type="button" class="skill-mini-btn" ${s.enabled === false ? 'disabled' : ''} onclick="addSkillFromModal('${s.id}')">添加</button>
                        <button type="button" class="skill-mini-btn" onclick="openSkillForm('${s.id}')">编辑</button>
                        <label class="skill-switch" title="${s.enabled !== false ? '已启用' : '已禁用'}">
                            <input type="checkbox" ${s.enabled !== false ? 'checked' : ''} onchange="toggleSkillEnabled('${s.id}', this.checked)">
                            <span class="track"></span>
                        </label>
                        <button type="button" class="skill-mini-btn danger" onclick="deleteSkill('${s.id}')">删除</button>
                    </span>
                </div>`;
            }).join('') || '<div class="skill-picker-empty">还没有技能</div>';

            const editing = skillsData.find(s => s.id === formOpen);
            const formHtml = (formOpen === '__new__' || editing) ? `
                <div class="skill-form">
                    <input id="skillFormName" placeholder="技能包名称" value="${escapeHtml(editing?.name || '')}" maxlength="60">
                    <input id="skillFormDesc" placeholder="一句话描述（可选）" value="${escapeHtml(editing?.description || '')}" maxlength="300">
                    <textarea id="skillFormPrompt" placeholder="技能包完整文档（Markdown，类似 SKILL.md）。建议结构：# 技能包名 / ## 用途 / ## 触发时机 / ## 工作流程 / ## 输出格式 / ## 约束">${escapeHtml(editing?.content || editing?.prompt || '')}</textarea>
                    <div class="skill-form-actions">
                        <button type="button" class="skill-mini-btn" onclick="closeSkillForm()">取消</button>
                        <button type="button" class="skill-mini-btn" onclick="saveSkillForm('${formOpen}')">保存</button>
                    </div>
                </div>` : '';

            const installedNames = new Set(skillsData.map(s => s.name));
            const tplRows = skillTemplates.map(t => {
                const installed = installedNames.has(t.name);
                return `
                <div class="skill-row">
                    ${skillIconHtml(t.icon, 'spi-icon')}
                    <span class="spi-body">
                        <span class="spi-name">${escapeHtml(t.name)}</span>
                        <span class="spi-desc">${escapeHtml(t.description || '')}</span>
                    </span>
                    <span class="skill-actions">
                        <button type="button" class="skill-mini-btn" ${installed ? 'disabled' : ''} onclick="installTemplate('${t.id}')">${installed ? '已安装' : '安装'}</button>
                    </span>
                </div>`;
            }).join('');

            body.innerHTML = `
                <div class="skill-section-title">已安装技能包 · 输入 / 或点「添加」加载调用</div>
                ${formHtml}
                ${rows}
                <button type="button" class="skill-mini-btn" onclick="openSkillForm('__new__')">＋ 手动添加技能包</button>
                <button type="button" class="skill-mini-btn" onclick="installSkillFromUrl()" style="background:#dbeafe;color:#1e40af;border-color:#93c5fd">🔗 从链接安装技能包</button>
                <button type="button" class="skill-mini-btn" onclick="pickSkillZip()" style="background:#dcfce7;color:#166534;border-color:#86efac">📎 上传本地压缩包（.zip）</button>
                <div class="skill-section-title">技能包市场 · 一键安装</div>
                ${tplRows}`;
            lucide.createIcons();
            if(formOpen){
                const formEl = body.querySelector('.skill-form');
                if(formEl) formEl.scrollIntoView({block:'center', behavior:'smooth'});
            }
        }

        function openSkillForm(id){
            const body = document.getElementById('skillModalBody');
            if(body){ body.dataset.formOpen = id; renderSkillManager(); }
        }
        function closeSkillForm(){
            const body = document.getElementById('skillModalBody');
            if(body){ body.dataset.formOpen = ''; renderSkillManager(); }
        }

        async function saveSkillForm(id){
            const name = document.getElementById('skillFormName')?.value.trim();
            const description = document.getElementById('skillFormDesc')?.value.trim() || '';
            const content = document.getElementById('skillFormPrompt')?.value.trim();
            if(!name || !content){ alert('请填写技能包名称和完整技能包文档'); return; }
            try{
                if(id && id !== '__new__'){
                    await fetch(`/api/skills/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, description, content})});
                }else{
                    await fetch('/api/skills', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, description, content})});
                }
                closeSkillForm();
                await loadSkills();
                renderSkillManager();
            }catch(err){ alert('保存失败：' + err.message); }
        }

        async function toggleSkillEnabled(id, enabled){
            try{
                await fetch(`/api/skills/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled})});
                const s = skillsData.find(x => x.id === id);
                if(s) s.enabled = enabled;
            }catch(err){ alert('操作失败：' + err.message); }
        }

        async function deleteSkill(id){
            const s = skillsData.find(x => x.id === id);
            if(!s || !confirm(`删除技能「${s.name}」？`)) return;
            try{
                await fetch(`/api/skills/${id}`, {method:'DELETE'});
                skillsData = skillsData.filter(x => x.id !== id);
                renderSkillManager();
            }catch(err){ alert('删除失败：' + err.message); }
        }

        async function installTemplate(tplId){
            const t = skillTemplates.find(x => x.id === tplId);
            if(!t) return;
            try{
                await fetch('/api/skills', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:t.name, description:t.description, content:t.content || t.prompt || '', icon:t.icon})});
                await loadSkills();
                renderSkillManager();
            }catch(err){ alert('安装失败：' + err.message); }
        }

        // —— 用户从链接安装技能包 ——
        async function installSkillFromUrl(){
            const url = (prompt('输入技能包链接：\n· GitHub 仓库：https://github.com/owner/repo\n· 单文件 SKILL.md：https://.../SKILL.md\n· .zip 直链：https://.../pkg.zip') || '').trim();
            if(!url) return;
            const force = /^(1\.)/.test(prompt('发现 P0 危险脚本时是否强制安装？\n输入 1 = 强制（自担风险），其他 = 拒绝安装', '0') || '');
            const statusBox = document.createElement('div');
            statusBox.style.cssText = 'position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 18px;border-radius:8px;z-index:9999;font-size:13px;max-width:560px;white-space:pre-wrap;box-shadow:0 6px 24px rgba(0,0,0,.2)';
            statusBox.textContent = '正在从链接安装技能包...';
            document.body.appendChild(statusBox);
            try{
                const r = await fetch('/api/skills/install', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url, force})});
                const data = await r.json();
                if(!r.ok){ statusBox.textContent = '❌ ' + (data.detail || '安装失败'); statusBox.style.background = '#b91c1c'; }
                else {
                    const inst = (data.installed || []).map(x => `✅ ${x.name}${x.tools > 0 ? '（脚本×'+x.tools+'）' : ''}`).join('\n');
                    const warn = (data.warnings || []).slice(0, 3).map(w => `⚠️ ${w.file}: ${w.message}`).join('\n');
                    const block = (data.blocked || []).map(b => `🚫 ${b.name}: ${(b.findings||[]).slice(0,2).map(f=>f.message).join('; ')}`).join('\n');
                    statusBox.style.background = (data.blocked && data.blocked.length) ? '#b91c1c' : '#15803d';
                    statusBox.textContent = `安装来源：${data.source}\n成功：${inst || '(无)'}\n警告：${warn || '(无)'}\n拦截：${block || '(无)'}`;
                    await loadSkills();
                    renderSkillManager();
                }
            }catch(err){
                statusBox.textContent = '❌ ' + err.message;
                statusBox.style.background = '#b91c1c';
            } finally {
                setTimeout(() => statusBox.remove(), 8000);
            }
        }

        // —— 2026-10-19 上传本地 .zip 技能包（不走外链，直接 multipart 到后端）——
        function pickSkillZip(){
            let input = document.getElementById('skillZipInput');
            if(!input){
                input = document.createElement('input');
                input.type = 'file';
                input.accept = '.zip,application/zip,application/x-zip-compressed';
                input.id = 'skillZipInput';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.addEventListener('change', () => {
                    const f = input.files && input.files[0];
                    input.value = '';
                    if(f) uploadSkillZip(f);
                });
            }
            input.click();
        }
        async function uploadSkillZip(file){
            if(!file) return;
            if(!/\.zip$/i.test(file.name)){ alert('请选择 .zip 压缩包（技能包目录内需包含 SKILL.md）'); return; }
            const force = /^(1\.)/.test(prompt('发现 P0 危险脚本时是否强制安装？\n输入 1 = 强制（自担风险），其他 = 拒绝安装', '0') || '');
            const statusBox = document.createElement('div');
            statusBox.style.cssText = 'position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 18px;border-radius:8px;z-index:9999;font-size:13px;max-width:560px;white-space:pre-wrap;box-shadow:0 6px 24px rgba(0,0,0,.2)';
            statusBox.textContent = `正在安装本地压缩包：${file.name}（${Math.max(1, Math.round(file.size / 1024))} KB）...`;
            document.body.appendChild(statusBox);
            try{
                const fd = new FormData();
                fd.append('file', file);
                fd.append('force', force ? 'true' : 'false');
                const r = await fetch('/api/skills/install/upload', {method:'POST', body:fd});
                const data = await r.json().catch(() => ({}));
                if(!r.ok){
                    statusBox.textContent = '❌ ' + (data.detail || '安装失败');
                    statusBox.style.background = '#b91c1c';
                    return;
                }
                const inst = (data.installed || []).map(x => `✅ ${x.name}${x.tools > 0 ? '（脚本×' + x.tools + '）' : ''}`).join('\n');
                const warn = (data.warnings || []).slice(0, 3).map(w => `⚠️ ${w.file}: ${w.message}`).join('\n');
                const block = (data.blocked || []).map(b => `🚫 ${b.name}: ${(b.findings || []).slice(0, 2).map(f => f.message).join('; ')}`).join('\n');
                statusBox.style.background = (data.blocked && data.blocked.length) ? '#b91c1c' : '#15803d';
                statusBox.textContent = `安装来源：${data.source}\n成功：${inst || '(无)'}\n警告：${warn || '(无)'}\n拦截：${block || '(无)'}`;
                await loadSkills();
                renderSkillManager();
            }catch(err){
                statusBox.textContent = '❌ ' + err.message;
                statusBox.style.background = '#b91c1c';
            } finally {
                setTimeout(() => statusBox.remove(), 8000);
            }
        }

        // —— AI 自主安装技能包 ——
        const SKILL_INSTALL_INSTRUCTION = `

[技能包系统] 本应用支持"技能包"：每个技能是一个独立的技能包文档（类似 SKILL.md，包含用途、触发时机、工作流程、输出格式、约束）。用户可以用 / 快速加载已安装的技能包，加载后技能包完整文档会进入对话上下文。当前已安装的技能包：${'{SKILL_LIST}'}。
如果用户想让你安装新技能包，或对话中形成了值得沉淀的完整工作流/方法论，你可以在回复末尾输出一个技能包安装块（严格使用以下格式，JSON 独占一个代码块，content 为完整 Markdown 技能文档）：
\`\`\`install-skill
{"name":"技能包名（30字内）","description":"一句话描述","icon":"lucide图标名（可选）","content":"# 技能包名\\n## 用途\\n...\\n## 触发时机\\n...\\n## 工作流程\\n...\\n## 输出格式\\n...\\n## 约束\\n..."}
\`\`\`
注意：content 必须是完整、独立、可复用的技能文档，而不是一句话提示词。仅在确有沉淀价值时输出，每次最多一个。`;

        function skillsSystemPromptSuffix(){
            const enabled = skillsData.filter(s => s.enabled !== false);
            const list = enabled.length ? enabled.map(s => s.name).join('、') : '（暂无）';
            return SKILL_INSTALL_INSTRUCTION.replace('{SKILL_LIST}', list);
        }

        function extractSkillInstalls(content){
            const text = String(content || '');
            const installs = [];
            const clean = text.replace(/```install-skill\s*([\s\S]*?)```/g, (m, body) => {
                try{
                    const obj = JSON.parse(body.trim().replace(/^json\s*/i, ''));
                    if(obj && obj.name && (obj.content || obj.prompt)) installs.push(obj);
                }catch(err){ /* 非法块直接丢弃 */ }
                return '';
            });
            return { clean: clean.trim(), installs };
        }

        function isSkillInstalledByName(name){
            return skillsData.some(s => s.name === name);
        }

        async function installAISkill(btn, jsonStr){
            let obj;
            try{ obj = JSON.parse(jsonStr); }catch(err){ return; }
            btn.disabled = true;
            btn.textContent = '安装中…';
            try{
                await fetch('/api/skills', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
                    name: String(obj.name || '').slice(0, 60),
                    description: String(obj.description || ''),
                    content: String(obj.content || obj.prompt || ''),
                    icon: String(obj.icon || 'sparkles'),
                })});
                await loadSkills();
                btn.textContent = '已安装 ✓';
            }catch(err){
                btn.disabled = false;
                btn.textContent = '安装失败，重试';
            }
        }
        window.addEventListener('keydown', e => {
            if(e.key === 'Escape') closeImagePreview();
        });

        let sendBusy = false;
        let messageQueue = [];
        async function sendMessage(){
            const input = document.getElementById('messageInput');
            const typed = input.value.trim();
            const pendingRefs = refs.slice();
            if(!typed && !pendingRefs.length) return;
            // 思考/生成中不拦截：改为排队，立即显示用户气泡，当前回复结束后自动依次提交
            if(sendBusy){
                messageQueue.push({message:typed, refs:pendingRefs});
                refs = [];
                renderRefs();
                input.value = '';
                autoGrow(input);
                if(!currentConversation){
                    currentConversation = {id:'', title:'新对话', messages:[]};
                    document.getElementById('messages').innerHTML = '';
                }
                addMessageBubble({role:'user', content:typed, attachments:pendingRefs});
                scrollBottom();
                return;
            }
            sendBusy = true;
            // 仅上传图片未输入文字也可以直接跑：按模式补一条默认提示词
            const message = typed || (mode === 'image' ? '参考上传的图片生成' : '请看看我上传的图片');
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            const requestedSize = chatSizeFromPrompt(message);
            refs = [];
            renderRefs();
            input.value = '';
            autoGrow(input);
            if(!currentConversation){
                currentConversation = {id:'', title:'新对话', messages:[]};
                document.getElementById('messages').innerHTML = '';
            }
            addMessageBubble({role:'user', content:message, attachments:pendingRefs});
const useStreaming = mode === 'chat' && !skillHasTools();
                const pendingText = mode === 'image' ? tr('chat.generatingImage') : (useStreaming ? '' : (mode === 'agent' ? tr('chat.agentWorking') : ''));
            const assistantBubble = addMessageBubble({role:'assistant', content: pendingText});
            if(useStreaming || mode === 'agent') assistantBubble.bubble.classList.add('streaming');
            scrollBottom();
            try {
                if(useStreaming) {
                    await streamChatMessage(message, pendingRefs, assistantBubble);
                } else if(mode === 'chat') {
                    const data = await fetch('/api/chat', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id: currentConversation.id || '',
                            message,
                            system_prompt: currentSystemPrompt(),
                            mode:'chat',
                            size: requestedSize,
                            model: provider === 'modelscope' ? (msModel || activeChatModel) : (activeChatModel || config.chat_model),
                            ms_model: provider === 'modelscope' ? (msModel || activeChatModel) : '',
                            reference_images: pendingRefs,
                            provider,
                            skill_id: skillHasTools() ? (activeSkill?.id || '') : '',
                        })
                    }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || tr('chat.requestFailed')); return r.json(); });
                    currentConversation = data.conversation;
                    rememberConversation(currentConversation.id);
                    setChatTitle(currentConversation.title);
                    renderMessages(currentConversation.messages || []);
                    await loadConversations();
                } else if(mode === 'agent') {
                    await streamAgentMessage(message, pendingRefs, assistantBubble);
                } else {
                    const data = await fetch('/api/chat', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id: currentConversation.id || '',
                            message,
                            system_prompt: currentSystemPrompt(),
                            mode,
                            size: requestedSize,
                            model: activeChatModel || config.chat_model,
                            image_model: activeImageModel || config.image_model,
                            reference_images: pendingRefs,
                            provider: activeImageProvider,
                        })
                    }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || tr('chat.requestFailed')); return r.json(); });
                    currentConversation = data.conversation;
                    rememberConversation(currentConversation.id);
                    setChatTitle(currentConversation.title);
                    renderMessages(currentConversation.messages || []);
                    await loadConversations();
                }
            } catch(err) {
                renderMessages([...(currentConversation.messages || []), {role:'assistant', content:err.message || tr('chat.requestFailed')}]);
            } finally {
                btn.disabled = false;
                sendBusy = false;
                scrollBottom();
                // 依次提交思考期间排队的追加消息
                const next = messageQueue.shift();
                if(next){
                    refs = next.refs;
                    if(next.message) input.value = next.message;
                    sendMessage();
                }
            }
        }

        async function streamAgentMessage(message, pendingRefs, assistantBubble){
            const currentProvider = provider;
            const currentMsModel = currentProvider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '';
            const currentChatModel = activeChatModel || config.chat_model;
            const res = await fetch('/api/chat/agent/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    system_prompt: currentSystemPrompt(),
                    mode:'agent',
                    model: currentProvider === 'modelscope' ? currentMsModel : currentChatModel,
                    ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                    image_model: activeImageModel || config.image_model,
                    reference_images: pendingRefs,
                    provider: currentProvider,
                    image_provider: activeImageProvider,
                })
            });
            if(!res.ok) throw new Error((await res.json()).detail || tr('chat.requestFailed'));
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            while(true){
                const {value, done} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for(const eventText of events){
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!line) continue;
                    let event;
                    try{ event = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
                    if(event.type === 'meta'){
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                    }
                    if(event.type === 'agent_action'){
                        // 意图判断完成：文本任务清空占位等 delta；图片任务显示状态
                        if(event.action !== 'chat' && event.reply){
                            assistantBubble.text.textContent = event.reply;
                            scrollBottom();
                        }
                    }
                    if(event.type === 'status'){
                        assistantBubble.text.textContent = event.text || '';
                        scrollBottom();
                    }
                    if(event.type === 'delta'){
                        fullText += event.delta || '';
                        assistantBubble.text.textContent = fullText;
                        scrollBottom();
                    }
                    if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                    if(event.type === 'done'){
                        assistantBubble.bubble.classList.remove('streaming');
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                        renderMessages(currentConversation.messages || []);
                        await loadConversations();
                    }
                }
            }
            assistantBubble.bubble.classList.remove('streaming');
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble){
            const currentProvider = provider;
            const currentMsModel = provider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '';
            const currentChatModel = activeChatModel || config.chat_model;

            const res = await fetch('/api/chat/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    system_prompt: currentSystemPrompt(),
                    mode:'chat',
                    model: currentProvider === 'modelscope' ? currentMsModel : currentChatModel,
                    ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                    provider: currentProvider,
                    reference_images: pendingRefs
                })
            });
            if(!res.ok) throw new Error((await res.json()).detail || tr('chat.requestFailed'));
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            while(true){
                const {value, done} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for(const eventText of events){
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!line) continue;
                    const event = JSON.parse(line.slice(5).trim());
                    if(event.type === 'meta'){
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                    }
                    if(event.type === 'delta'){
                        fullText += event.delta || '';
                        assistantBubble.text.textContent = fullText;
                        scrollBottom();
                    }
                    if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                    if(event.type === 'done'){
                        assistantBubble.bubble.classList.remove('streaming');
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                        renderMessages(currentConversation.messages || []);
                        await loadConversations();
                    }
                }
            }
            assistantBubble.bubble.classList.remove('streaming');
        }

        function scrollBottom(){
            const sync = () => {
                const box = document.getElementById('messages');
                if(box) box.scrollTop = box.scrollHeight;
            };
            requestAnimationFrame(() => {
                sync();
                requestAnimationFrame(sync);
                setTimeout(sync, 120);
            });
        }
        function ensureEmbedMode(){
            try {
                const params = new URLSearchParams(location.search);
                let insideFrame = false;
                try { insideFrame = window.self !== window.top; } catch(frameError) { insideFrame = true; }
                if(params.get('embed') === '1' || insideFrame) document.documentElement.classList.add('chat-embed');
            } catch(e) {}
        }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
        function setupEmbedComposerResize(){
            if(!document.documentElement.classList.contains('chat-embed')) return;
            const wrap = document.querySelector('.composer-wrap');
            if(!wrap) return;
            let handle = wrap.querySelector('.composer-resize-handle');
            if(!handle){
                handle = document.createElement('div');
                handle.className = 'composer-resize-handle';
                handle.setAttribute('role', 'separator');
                handle.setAttribute('aria-label', '拖拽调整输入框高度');
                handle.setAttribute('title', '拖拽调整输入框高度');
                wrap.prepend(handle);
            }
            const clampComposerHeight = value => Math.max(220, Math.min(520, Math.round(Number(value) || 320)));
            const readComposerHeight = () => {
                const inline = parseFloat(document.documentElement.style.getPropertyValue('--embed-composer-h'));
                if(Number.isFinite(inline) && inline > 0) return clampComposerHeight(inline);
                const computed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--embed-composer-h'));
                return clampComposerHeight(Number.isFinite(computed) ? computed : 320);
            };
            const setComposerHeight = value => {
                document.documentElement.style.setProperty('--embed-composer-h', `${clampComposerHeight(value)}px`, 'important');
                scrollBottom();
            };
            let drag = null;
            const beginComposerResize = event => {
                if(event.button !== undefined && event.button !== 0) return;
                drag = {startY:event.clientY, startH:readComposerHeight()};
                document.body.classList.add('embed-composer-resizing');
                (event.currentTarget || handle).setPointerCapture?.(event.pointerId);
                window.addEventListener('pointermove', onMove, {passive:false});
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
                event.preventDefault();
            };
            const onMove = event => {
                if(!drag) return;
                const next = drag.startH + drag.startY - event.clientY;
                setComposerHeight(next);
                event.preventDefault();
            };
            const onUp = () => {
                drag = null;
                document.body.classList.remove('embed-composer-resizing');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onUp);
                window.removeEventListener('pointercancel', onUp);
            };
            handle.addEventListener('pointerdown', beginComposerResize);
            const composer = wrap.querySelector('.composer');
            composer?.addEventListener('pointerdown', event => {
                const rect = composer.getBoundingClientRect();
                const isTopEdge = event.clientY >= rect.top && event.clientY <= rect.top + 10;
                if(!isTopEdge) return;
                if(event.target.closest('button,input,select,textarea,.model-picker-popover,.resolution-picker-popover,.system-prompt-popover')) return;
                beginComposerResize(event);
            });
            setComposerHeight(readComposerHeight());
        }

        window.onload = async () => {
            ensureEmbedMode();
            applyLanguage();
            syncSystemPromptUI();
            setupEmbedComposerResize();
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            await loadConversations();
            await loadSkills();
            updateComposerOverflow();
        };

        // 技能选择器：输入监听 + 点击外部关闭
        document.getElementById('messageInput')?.addEventListener('input', () => {
            const picker = document.getElementById('skillPicker');
            if(picker && !picker.classList.contains('hidden')) updateSkillPicker();
        });
        document.getElementById('messageInput')?.addEventListener('keyup', event => {
            if(['ArrowUp','ArrowDown','Enter','Escape','Shift'].includes(event.key)) return;
            updateSkillPicker();
        });
        document.addEventListener('click', event => {
            if(skillPickerState.open && !event.target.closest('#skillPicker') && !event.target.closest('#messageInput')) closeSkillPicker();
        });
    </script>
