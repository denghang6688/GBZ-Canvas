<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言设置</title>
    <script src="/static/vendor/js/lucide.js?v=V26.10.15.1.1790042522"></script>
    <script src="/static/js/theme.js?v=V26.10.15.1.1790042521"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=V26.10.15.1.1790042522');
        * { box-sizing:border-box; }
        html, body { margin:0; min-height:100%; background:#121722; color:#eef2f7; font-family:Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
        .page { width:min(860px, calc(100% - 56px)); margin:0 auto; padding:44px 0 56px; }
        .back { height:34px; padding:0 12px; border:0; border-radius:10px; background:#202838; color:#c8d2e2; display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-weight:750; }
        h1 { margin:22px 0 8px; font-size:28px; line-height:1.15; }
        .sub { margin:0 0 24px; color:#9aa7bb; font-size:13px; font-weight:650; }
        .langs { display:grid; gap:12px; }
        .lang {
            min-height:92px;
            padding:18px;
            border:0;
            border-radius:16px;
            background:#1b2230;
            color:#eef2f7;
            text-align:left;
            cursor:pointer;
            display:grid;
            grid-template-columns:44px 1fr auto;
            align-items:center;
            gap:14px;
            box-shadow:0 16px 42px rgba(0,0,0,.18);
        }
        .lang:hover { background:#20293a; }
        .lang.active { box-shadow:0 16px 42px rgba(51,112,255,.2), inset 0 0 0 2px #3370ff; }
        .mark { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:#273247; color:#e9f0ff; font-size:16px; font-weight:900; }
        .name { font-size:16px; font-weight:850; }
        .desc { margin-top:5px; color:#9aa7bb; font-size:12px; font-weight:650; }
        .check { color:#7aa2ff; opacity:0; }
        .lang.active .check { opacity:1; }
        html:not(.theme-dark):not(.theme-custom), html:not(.theme-dark):not(.theme-custom) body { background:#f6f8fb; color:#1f2329; }
        html:not(.theme-dark):not(.theme-custom) .sub,
        html:not(.theme-dark):not(.theme-custom) .desc { color:#64748b; }
        html:not(.theme-dark):not(.theme-custom) .back,
        html:not(.theme-dark):not(.theme-custom) .lang { background:#fff; color:#1f2329; box-shadow:0 16px 42px rgba(31,35,41,.08); }
        html:not(.theme-dark):not(.theme-custom) .lang:hover { background:#f1f4f8; }
        html.theme-custom, html.theme-custom body { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 8%, #080b10); color:#f5fbff; }
        html.theme-custom .back,
        html.theme-custom .lang { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 7%, #111722); color:#f5fbff; border:1px solid color-mix(in srgb, var(--studio-custom-color, #7c5cff) 28%, #25262b); box-shadow:0 18px 44px rgba(0,0,0,.18); }
        html.theme-custom .back:hover,
        html.theme-custom .lang:hover { background:color-mix(in srgb, var(--studio-custom-color, #7c5cff) 14%, #111722); border-color:var(--studio-custom-color, #7c5cff); }
        html.theme-custom .sub,
        html.theme-custom .desc { color:#b7d8e4; }
        html.theme-custom .mark { background:var(--studio-custom-color, #7c5cff); color:#071018; }
        html.theme-custom .check { color:var(--studio-custom-color, #7c5cff); }
        html.theme-custom .lang.active { box-shadow:0 16px 42px rgba(0,0,0,.2), inset 0 0 0 2px var(--studio-custom-color, #7c5cff); }
        @media (max-width:760px) {
            .page { width:calc(100% - 28px); padding:24px 0 36px; }
        }

        /* Monochrome language page. */
        :root,
        html.theme-dark,
        body.theme-dark,
        html.theme-custom,
        body.theme-custom {
            --lang-bg:#050505;
            --lang-card:#1f1f1f;
            --lang-card-hover:#252525;
            --lang-text:#f4f4f4;
            --lang-muted:#a6a6a6;
            --lang-line:#f4f4f4;
            --lang-strong:#f4f4f4;
            --lang-strong-text:#080808;
        }
        html:not(.theme-dark):not(.theme-custom),
        html:not(.theme-dark):not(.theme-custom) body {
            --lang-bg:#f7f7f7;
            --lang-card:#ffffff;
            --lang-card-hover:#eeeeee;
            --lang-text:#111111;
            --lang-muted:#5f5f5f;
            --lang-line:#111111;
            --lang-strong:#111111;
            --lang-strong-text:#ffffff;
        }
        html,
        body {
            background:var(--lang-bg) !important;
            color:var(--lang-text) !important;
        }
        .back,
        .lang,
        html.theme-custom .back,
        html.theme-custom .lang,
        html:not(.theme-dark):not(.theme-custom) .back,
        html:not(.theme-dark):not(.theme-custom) .lang {
            background:var(--lang-card) !important;
            color:var(--lang-text) !important;
            border:0 !important;
            box-shadow:none !important;
        }
        .back:hover,
        .lang:hover,
        html.theme-custom .back:hover,
        html.theme-custom .lang:hover,
        html:not(.theme-dark):not(.theme-custom) .lang:hover {
            background:var(--lang-card-hover) !important;
        }
        .sub,
        .desc,
        html.theme-custom .sub,
        html.theme-custom .desc,
        html:not(.theme-dark):not(.theme-custom) .sub,
        html:not(.theme-dark):not(.theme-custom) .desc {
            color:var(--lang-muted) !important;
        }
        .mark,
        html.theme-custom .mark {
            background:var(--lang-strong) !important;
            color:var(--lang-strong-text) !important;
        }
        .check,
        html.theme-custom .check {
            color:var(--lang-strong) !important;
        }
        .lang.active,
        html.theme-custom .lang.active {
            box-shadow:inset 0 0 0 2px var(--lang-line) !important;
        }
    </style>
</head>
<body>
    <main class="page">
        <button class="back" type="button" data-back><i data-lucide="arrow-left" class="w-4 h-4"></i><span>返回设置</span></button>
        <h1>语言设置</h1>
        <p class="sub">选择界面语言，设置会同步到主界面和已打开页面。</p>

        <section class="langs" aria-label="语言选项">
            <button class="lang" type="button" data-lang="zh">
                <span class="mark">中</span>
                <span><span class="name">中文</span><span class="desc">简体中文界面</span></span>
                <i class="check" data-lucide="check-circle-2"></i>
            </button>
            <button class="lang" type="button" data-lang="en">
                <span class="mark">EN</span>
                <span><span class="name">English</span><span class="desc">English interface</span></span>
                <i class="check" data-lucide="check-circle-2"></i>
            </button>
        </section>
    </main>
    <script>
        const current = localStorage.getItem('studio_lang') || 'zh';
        document.querySelectorAll('[data-lang]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === current);
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-lang]').forEach(item => item.classList.toggle('active', item === btn));
                window.parent.postMessage({ type:'studio-set-language', lang:btn.dataset.lang }, '*');
            });
        });
        document.querySelector('[data-back]').addEventListener('click', () => {
            window.parent.postMessage({ type:'studio-switch-page', page:'settings' }, '*');
        });
        if(window.lucide) lucide.createIcons();
    </script>
</body>
</html>
