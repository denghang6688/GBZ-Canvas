<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>资产库管理</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                if(theme === 'custom') {
                    document.documentElement.classList.add('studio-theme-custom');
                    document.documentElement.classList.add('theme-custom');
                    document.documentElement.style.setProperty('--studio-custom-color', '#22c55e');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=V10-14.1790042522"></script>
    <script src="/static/js/theme.js?v=V10-14.1790042521"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=V10-14.1790492361">
    <link rel="stylesheet" href="/static/css/asset-manager.css?v=V10-14.1790491732">
</head>
<body>
    <div class="asset-page">
        <header class="asset-page-head">
            <div>
                <div class="asset-title">资产库管理</div>
                <div class="asset-sub">按库、分组、内容和预览管理图片资产、工作流与提示词。</div>
            </div>
            <div class="asset-head-actions">
                <div id="assetStatus" class="asset-status">准备就绪</div>
                <button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
            </div>
        </header>

        <div class="asset-tabs">
            <button id="assetTabAssets" class="active" type="button" data-tab="assets"><i data-lucide="image"></i><span>图片资产</span></button>
            <button id="assetTabWorkflows" type="button" data-tab="workflows"><i data-lucide="workflow"></i><span>工作流管理</span></button>
            <button id="assetTabPrompts" type="button" data-tab="prompts"><i data-lucide="text-cursor-input"></i><span>提示词库</span></button>
            <button id="assetTabCanvasAssets" type="button" data-tab="canvas-assets"><i data-lucide="layout-dashboard"></i><span>画布资产</span></button>
            <button id="assetTabLocal" type="button" data-tab="local"><i data-lucide="folder-open"></i><span>本地素材</span></button>
        </div>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.md,.markdown,.doc,.docx,.xls,.xlsx,.csv,.json,.yaml,.yml,.log,.zip,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,text/csv,application/json,application/zip" multiple hidden>
    <script src="/static/js/asset-manager.js?v=V10-14.1790042520"></script>
</body>
</html>
