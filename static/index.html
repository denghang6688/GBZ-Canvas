<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/output/canvas-top-left-icon-v4-bw.png" type="image/png">
    <title>AI Studio</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }</style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'custom') {
                    theme = 'dark';
                    localStorage.setItem('studio_theme', 'dark');
                    localStorage.setItem('canvas_theme', 'dark');
                }
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=V26.10.22.1.1790042522"></script>
    <script src="/static/js/theme.js?v=V26.10.22.1.1790042521"></script>
    <script src="/static/js/i18n.js?v=V26.10.22.1.1790305929"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=V26.10.22.1.1790042522');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --monitor-bg: rgba(255, 255, 255, 0.7);
            --monitor-border: rgba(0, 0, 0, 0.05);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --divider: rgba(0, 0, 0, 0.1);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
            --author-name: #000;
            --social-icon: #ccc;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #050505;
            --sidebar-bg: #050505;
            --stage-bg: #080808;
            --border: #242424;
            --stage-border: #2d2d2d;
            --text: #f1f1f1;
            --muted: #9a9a9a;
            --nav-hover-bg: #181818;
            --monitor-bg: rgba(24, 24, 24, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.1);
            --monitor-shadow: rgba(0, 0, 0, 0.42);
            --divider: rgba(255, 255, 255, 0.14);
            --scrollbar: #3a3a3a;
            --scrollbar-hover: #555555;
            --author-name: #f1f1f1;
            --social-icon: #888888;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            height: 100vh;
            max-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.5s var(--fluid-ease) 0.5s, background 0.3s, border-color 0.3s;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 220px;
            transition-delay: 0s;
        }

        body.studio-scale-host .sidebar {
            height: calc(100vh / var(--studio-ui-scale, 1));
            max-height: calc(100vh / var(--studio-ui-scale, 1));
            zoom: var(--studio-ui-scale, 1);
        }

        /* 首次加载时与 iframe 的 0.5s 淡入同步播放，避免侧栏"焊死"在原地造成视觉断层 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            /* 2026-09-20 去掉白色描边：var(--text) 在暗色主题下接近白色，形成白边 */
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
            padding: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
            /* 仅保留 hover 真正会用到的属性过渡，避免 transition: all 因首屏属性补齐被意外触发 */
            transition: transform 0.6s var(--fluid-ease) 0.5s, border-radius 0.6s var(--fluid-ease) 0.5s, border-color 0.3s, background-color .18s, box-shadow .2s;
        }

        .sidebar:hover .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
            transition-delay: 0s;
        }

        .logo-ring:hover,
        .logo-ring:focus-visible {
            background: var(--nav-hover-bg);
            border-color: var(--text);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16), 0 10px 24px rgba(15, 23, 42, .08);
            outline: none;
        }

        .logo-ring:hover #logo-dot,
        .logo-ring:focus-visible #logo-dot {
            transform: scale(1.8);
        }

        .logo-ring:active {
            transform: scale(.94);
            transition-delay: 0s;
        }

        .sidebar:hover .logo-ring:active {
            transform: rotate(90deg) scale(.94);
        }

        #logo-dot {
            transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
        }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            /* 只对 width 做带延迟的过渡（侧栏悬停展开效果）；background/color 不参与过渡，避免 active 切换时底色"流动" */
            transition: width 0.3s var(--fluid-ease) 0.5s;
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        .sidebar:hover .nav-item {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s 0.5s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .nav-fold-toggle {
            position: relative;
            width: 48px;
            height: 36px;
            flex: 0 0 36px;
            margin: 0 0 6px;
            padding-left: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            overflow: hidden;
            transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .sidebar:hover .nav-fold-toggle {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-fold-toggle:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .nav-fold-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            transition: transform 0.25s var(--fluid-ease);
        }

        .nav-fold-toggle[aria-expanded="false"] .nav-fold-icon {
            transform: rotate(-90deg);
        }

        .nav-fold-group {
            width: 100%;
            flex: 0 0 auto;
            max-height: 720px;
            opacity: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
        }

        .nav-fold-group.is-collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar nav {
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 6px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, .34) transparent;
        }

        .sidebar::-webkit-scrollbar { width: 4px !important; }
        .sidebar::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav::-webkit-scrollbar { width: 4px !important; }
        .sidebar nav::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar nav::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav > * {
            flex-shrink: 0;
        }

        /* 主舞台区 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        body.studio-scale-host .stage {
            margin: max(10px, calc(16px * var(--studio-ui-scale, 1)));
            border-radius: max(20px, calc(32px * var(--studio-ui-scale, 1)));
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: scale(1.02);
            filter: blur(4px);
            transition: all 0.5s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        /* 左下角监视器 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--monitor-bg);
            backdrop-filter: blur(12px);
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--monitor-border);
            box-shadow: 0 4px 20px var(--monitor-shadow);
            font-family: monospace;
            transition: all 0.4s var(--fluid-ease);
        }

        .nano-monitor.is-busy {
            background: #000;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-group:first-child {
            gap: 8px;
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 2px;
            flex: 0 0 auto;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }

        /* 作者组件 */
        .author-box {
            width: 100%;
            height: 60px;
            flex: 0 0 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible; /* 2026-09-26 三个社交图标超出盒宽，裁剪职责移交给 .dx-letters-clip */
        }

        /* 2026-09-26 只裁剪滑出的 D/H 字母，不影响悬停展开的图标行。
           flex 居中：字母是绝对定位无 left/top，靠静态位置居中（原 author-box 也是这么做的） */
        .dx-letters-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dx-letter {
            position: absolute;
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
            /* 只过渡 hover 时真正改的 transform/opacity，避免 all 触发延迟 */
            transition: transform 0.5s var(--fluid-ease) 0.4s, opacity 0.5s var(--fluid-ease) 0.4s;
            z-index: 10;
        }

        .letter-d { transform: translateX(-8px); }
        .letter-x { transform: translateX(8px); }

        .sidebar:hover .letter-d {
            transform: translateX(-120px);
            opacity: 0;
            transition-delay: 0s;
        }

        .sidebar:hover .letter-x {
            transform: translateX(120px);
            opacity: 0;
            transition-delay: 0s;
        }

        .author-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 2026-09-26 三个图标改左对齐，避免 GitHub 被顶出屏幕左缘 */
            padding-left: 2px;
            white-space: nowrap;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s var(--fluid-ease) 0s;
            pointer-events: none;
        }

        .sidebar:hover .author-content-wrap {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.2s;
            pointer-events: auto;
        }

        .author-name-lite {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--author-name);
        }

        .social-row-lite { display: flex; gap: 12px; }

        .social-icon-lite {
            color: var(--social-icon);
            transition: color 0.2s, transform 0.2s;
        }

        .social-icon-lite:hover {
            color: var(--text);
            transform: translateY(-1px);
        }

        .side-actions {
            margin-top:auto;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
            flex:0 0 auto;
        }

        .side-pill {
            width:44px;
            height:36px;
            border-radius:999px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 只过渡 hover/激活会改的属性，避免 all 触发延迟 */
            transition: width 0.3s var(--fluid-ease) 0.5s, gap 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow:hidden;
            gap:8px;
            position:relative;
        }

        .sidebar:hover .side-pill {
            width: 170px;
            transition-delay: 0s;
        }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .side-pill.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .side-pill.update-available {
            border-color:#22c55e;
            color:#16a34a;
            overflow:visible;
        }

        html.theme-dark .side-pill.update-available,
        body.theme-dark .side-pill.update-available {
            border-color:#86efac;
            color:#86efac;
        }

        .side-pill.update-available::after {
            content:"NEW";
            position:absolute;
            top:-7px;
            right:-9px;
            min-width:28px;
            height:16px;
            padding:0 5px;
            border-radius:999px;
            background:#22c55e;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:9px;
            font-weight:900;
            letter-spacing:.02em;
            box-shadow:0 6px 16px rgba(34,197,94,.28), 0 0 0 3px rgba(34,197,94,.12);
            pointer-events:none;
        }

        html.theme-dark .side-pill.update-available::after,
        body.theme-dark .side-pill.update-available::after {
            background:#4ade80;
            color:#052e16;
            box-shadow:0 6px 16px rgba(74,222,128,.22), 0 0 0 3px rgba(74,222,128,.12);
        }

        .side-pill svg { width: 16px; height: 16px; flex:0 0 auto; }
        .theme-dock {
            width:44px;
            height:36px;
            padding:3px;
            border-radius:999px;
            border:1px solid var(--border);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:2px;
            overflow:hidden;
            flex-shrink:0;
            transition: width 0.3s var(--fluid-ease) 0.5s, gap 0.3s var(--fluid-ease) 0.5s, border-color .2s, background-color .2s;
        }
        .sidebar:hover .theme-dock,
        .sidebar.is-pinned .theme-dock {
            width:170px;
            gap:6px;
            transition-delay:0s;
        }
        .theme-dock-btn {
            width:100%;
            min-width:0;
            height:28px;
            border:0;
            border-radius:999px;
            background:transparent;
            color:var(--muted);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            cursor:pointer;
            font-size:12px;
            font-weight:850;
            letter-spacing:.02em;
            overflow:hidden;
            transition:background-color .18s, color .18s;
        }
        .theme-dock-btn:hover {
            background:var(--nav-hover-bg);
            color:var(--text);
        }
        .theme-dock-btn.active {
            background:var(--text);
            color:var(--bg);
        }
        .theme-dock-btn svg {
            width:15px;
            height:15px;
            flex:0 0 auto;
        }
        .theme-dock-btn span {
            opacity:0;
            max-width:0;
            white-space:nowrap;
            overflow:hidden;
            transition:opacity .24s .5s, max-width .24s var(--fluid-ease) .5s;
        }
        .nav-theme-dock { margin:6px 0 2px; }
        .sidebar:hover .theme-dock-btn span,
        .sidebar.is-pinned .theme-dock-btn span {
            opacity:1;
            max-width:80px;
            transition-delay:.12s;
        }
        .settings-fold-chevron {
            width: 13px !important;
            height: 13px !important;
            margin-left: -2px;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            transition: opacity 0.3s 0.5s, max-width 0.3s var(--fluid-ease) 0.5s, transform .22s var(--fluid-ease);
        }
        .sidebar:hover .settings-fold-chevron,
        .sidebar.is-pinned .settings-fold-chevron {
            opacity: .72;
            max-width: 16px;
            transition-delay: .15s, .15s, 0s;
        }
        .settings-fold-toggle[aria-expanded="true"] .settings-fold-chevron {
            transform: rotate(180deg);
        }
        .settings-fold-group {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            transition: max-height .28s var(--fluid-ease), opacity .18s ease;
        }

        /* =================================================================

           用独立 scale 属性替代 transform 缩放，避免与关键帧动画互相覆盖。
           ================================================================= */
        #logo-dot {
            animation: logo-cute-idle 4.2s ease-in-out infinite,
                       logo-cute-glow 3.4s ease-in-out infinite;
            transform-origin: 50% 62%;
        }
        .logo-ring:hover #logo-dot,
        .logo-ring:focus-visible #logo-dot {
            transform: none;
            scale: 1.8;
            animation: logo-cute-wave .48s ease-in-out infinite;

        .sidebar.is-pinned #logo-dot {
            transform: none;
            scale: 1.35;
        }
        /* LOGO 保持方形圆角：侧栏悬停/固定时不再旋转、不再裁成圆形 */
        .logo-ring,

        .sidebar.is-pinned .logo-ring {

        }
        .sidebar:hover .logo-ring,
        .sidebar.is-pinned .logo-ring {
            transform: none !important;
        }
        .sidebar:hover .logo-ring:active {
            transform: scale(.94) !important;
        }
        @keyframes logo-cute-idle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            12% { transform: translateY(-2.5px) rotate(-7deg); }
            24% { transform: translateY(0) rotate(0deg); }
            34% { transform: translateY(-2px) rotate(6deg); }
            44% { transform: translateY(0) rotate(0deg) scale(1.05, .95); }
            54% { transform: translateY(-1.5px) rotate(0deg) scale(.96, 1.06); }
            64% { transform: translateY(0) rotate(0deg) scale(1.02, .99); }
            76% { transform: translateY(-2px) rotate(-5deg); }
            88% { transform: translateY(-1px) rotate(4deg); }
        }
        @keyframes logo-cute-glow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(160,160,160,.25)); }
            50%      { filter: drop-shadow(0 0 9px rgba(160,160,160,.45)); }
        }
        @keyframes logo-cute-wave {
            0%, 100% { transform: translateY(0) rotate(-9deg); }
            50%      { transform: translateY(-4px) rotate(9deg); }

            100% { transform: scaleY(1); }

        /* SVG 自带底色/描边，屏蔽旧主题对 #logo-dot 的背景填充 */
        #logo-dot,

                    <button id="update-source-github" class="update-source-card" type="button" data-update-source="github" onclick="setUpdateSource('github')">

                            <div class="update-source-title">

                                <span>国际源，从作者 GitHub 仓库读取更新；直连不畅时自动切换国内镜像。</span>

                            <div class="update-source-head-right">
                                <span class="update-source-check" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </span>
                                <span class="update-source-badge">待测试</span>

                        <div class="connectivity-list" data-connectivity-source="github"></div>
                    </button>
                </div>
                <div id="project-update-summary" class="update-modal-summary warn">
                    <span class="update-modal-dot" aria-hidden="true"></span>
                    <div>
                        <strong id="project-update-summary-title">建议先测试连通性</strong>
                        <span id="project-update-summary-text"></span>
                    </div>
                </div>
            </div>
            <div class="studio-modal-actions">
                <button id="connectivity-test-btn" class="studio-modal-btn" type="button" onclick="runUpdateConnectivityTest()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 3v6h-6"></path>
                    </svg>
                    <span id="connectivity-test-text">测试连通性</span>
                </button>
                <button class="studio-modal-btn" type="button" onclick="closeProjectUpdateModal()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
                    <span id="project-update-cancel-text">返回</span>
                </button>
                <button id="project-update-confirm-btn" class="studio-modal-btn primary" type="button" onclick="confirmProjectUpdate()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 3v6h-6"></path>
                    </svg>
                    <span id="project-update-confirm-text">开始更新</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const LOCAL_NAV_COLLAPSED_KEY = 'studio_local_nav_collapsed';
        const SIDEBAR_SETTINGS_COLLAPSED_KEY = 'studio_sidebar_settings_collapsed';
        const SIDEBAR_PINNED_KEY = 'studio_sidebar_pinned';
        const DEFAULT_PAGE_ID = 'canvas';
        const PAGE_IDS = ['zimage','enhance','klein','angle','canvas','asset-manager','settings','api-settings','comfyui-settings','language-settings'];
        const LOCAL_PAGE_IDS = ['zimage','enhance','klein','angle'];
        const PROJECT_URL = 'https://github.com/denghang6688/GBZ-Canvas';
        const MODELSCOPE_URL = 'https://www.modelscope.cn/studios/hans186/GBZ-Canvas';
        let appInfo = { version:'', repo_url:PROJECT_URL, modelscope_repo_url:MODELSCOPE_URL, sources:{ modelscope:{ configured:true }, github:{ configured:true } } };
        let updateConnectivityResult = null;
        let projectUpdateRunning = false;
        let projectUpdateAbort = null;  // 当前更新请求的 AbortController，便于用户中途取消
        let updateSource = 'modelscope';
        let projectUpdateNotes = null;

        function setSidebarPinned(pinned, options = {}) {
            const sidebar = document.getElementById('studioSidebar');
            const logo = document.getElementById('sidebarLogoToggle');
            if(!sidebar) return;
            pauseScaleInFrames();
            sidebar.classList.toggle('is-pinned', pinned);
            if(!pinned) {
                sidebar.classList.add('is-collapsing');
                window.setTimeout(() => sidebar.classList.remove('is-collapsing'), 360);
            } else {
                sidebar.classList.remove('is-collapsing');
            }
            if(logo) {
                logo.setAttribute('aria-pressed', pinned ? 'true' : 'false');
                logo.title = pinned ? '收起导航栏' : '固定导航栏';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_PINNED_KEY, pinned ? '1' : '0');
        }

        function toggleSidebarPinned(event) {
            event?.preventDefault?.();
            event?.stopPropagation?.();
            const sidebar = document.getElementById('studioSidebar');
            setSidebarPinned(!sidebar?.classList.contains('is-pinned'));
        }

        function restoreSidebarPinned() {
            setSidebarPinned(localStorage.getItem(SIDEBAR_PINNED_KEY) === '1', { skipRemember:true });
        }

        function setLocalNavCollapsed(collapsed, options = {}) {
            const group = document.getElementById('local-nav-group');
            const toggle = document.getElementById('local-nav-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开本地功能' : '折叠本地功能';
            }
            if(!options.skipRemember) localStorage.setItem(LOCAL_NAV_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleLocalNav() {
            const group = document.getElementById('local-nav-group');
            setLocalNavCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreLocalNav(id) {
            const savedCollapsed = localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1';
            setLocalNavCollapsed(savedCollapsed && !LOCAL_PAGE_IDS.includes(id), { skipRemember:true });
        }

        function setSidebarSettingsCollapsed(collapsed, options = {}) {
            const group = document.getElementById('settings-fold-group');
            const toggle = document.getElementById('settings-fold-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开更多设置' : '收起更多设置';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleSidebarSettings() {
            const group = document.getElementById('settings-fold-group');
            setSidebarSettingsCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreSidebarSettings(id) {
            const savedCollapsed = localStorage.getItem(SIDEBAR_SETTINGS_COLLAPSED_KEY) !== '0';
            setSidebarSettingsCollapsed(savedCollapsed && id !== 'comfyui-settings', { skipRemember:true });
        }

        function resetStudioRootScroll() {
            try {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            } catch(e) {}
        }

        function triggerLogoWink() {
            const logo = document.getElementById('logo-dot');
            if(!logo) return;
            logo.classList.remove('wink');
            void logo.getBoundingClientRect();
            logo.classList.add('wink');
            clearTimeout(triggerLogoWink._t);
            triggerLogoWink._t = setTimeout(() => logo.classList.remove('wink'), 750);
        }

        function switchUI(el, id, options = {}) {
            resetStudioRootScroll();
            try { triggerLogoWink(); } catch(e) {}
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            if (!target.src) target.src = target.dataset.src;
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            // sync theme to newly activated iframe
            syncThemeToFrame(target);
            syncLanguageToFrame(target);
            syncScaleToFrame(target);
            syncFrameOpacityToFrame(target);
            if(LOCAL_PAGE_IDS.includes(id)) {
                setLocalNavCollapsed(false, { skipRemember:true });
            } else {
                setLocalNavCollapsed(localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1', { skipRemember:true });
            }
            if(id === 'comfyui-settings') {
                setSidebarSettingsCollapsed(false, { skipRemember:true });
            }
            // 切换到画布时通知刷新工作流列表（防止在 comfyui-settings 修改后画布未及时更新）
            if (id === 'canvas' && target.src) {
                try { target.contentWindow?.postMessage({ type: 'canvas-focus' }, '*'); } catch(e) {}
                if(!options.keepWorkflowNav) {
                    try { target.contentWindow?.postMessage({ type: 'studio-close-workflow-nav' }, '*'); } catch(e) {}
                }
            }
            resetStudioRootScroll();
        }

        function setStudioNavActive(kind) {
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            const selector = kind === 'workflow'
                ? '#workflow-nav-entry'
                : '[onclick*="\'canvas\'"],[onclick*="&quot;canvas&quot;"]';
            document.querySelector(selector)?.classList.add('active');
        }

        function canvasListFrameUrl(options = {}) {
            const params = new URLSearchParams();
            params.set('v', '2026.07.13.theme-back');
            try {
                const project = options.project || localStorage.getItem('canvasListCurrentProjectId') || '';
                if(project) params.set('project', project);
            } catch(e) {}
            if(options.openWorkflowNav) params.set('openWorkflowNav', '1');
            params.set('v', '2026.07.16.pure-dark');
            return `/static/canvas-list.html?${params.toString()}`;
        }

        function isCanvasListFrame(frame) {
            if(!frame || !frame.src) return false;
            try {
                return new URL(frame.src, location.href).pathname.endsWith('/static/canvas-list.html');
            } catch(e) {
                return String(frame.src || '').includes('/static/canvas-list.html');
            }
        }

        function openWorkflowNavigation(el, options = {}) {
            const frame = document.getElementById('frame-canvas');
            const shouldLoadCanvasList = !frame?.src || !isCanvasListFrame(frame);
            const canvasEntry = document.querySelector('[onclick*="\'canvas\'"],[onclick*="&quot;canvas&quot;"]');
            switchUI(canvasEntry || el, 'canvas', { keepWorkflowNav:true });
            setStudioNavActive('workflow');
            if(frame) frame.dataset.src = canvasListFrameUrl({ project:options.project });
            const openPanel = () => {
                try { frame?.contentWindow?.postMessage({ type:'studio-open-workflow-nav' }, '*'); } catch(e) {}
            };
            if(frame && shouldLoadCanvasList) {
                frame.addEventListener('load', openPanel, { once:true });
                frame.src = canvasListFrameUrl({ openWorkflowNav:true, project:options.project });
            } else if(frame && frame.src) {
                openPanel();
                setTimeout(openPanel, 180);
            } else if(frame) {
                frame.addEventListener('load', openPanel, { once:true });
                frame.src = canvasListFrameUrl({ openWorkflowNav:true, project:options.project });
            }
        }

        function forwardStudioApiChange(data) {
            if(!data || !['providers-changed','workflows-changed','comfy-instances-changed'].includes(data.type)) return;
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                } catch(e) {}
            });
        }

        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            if(event.data?.type === 'studio-switch-page') {
                const page = event.data.page;
                if(PAGE_IDS.includes(page)) {
                    const settingsChild = page === 'api-settings' || page === 'comfyui-settings' || page === 'language-settings';
                    const trigger = settingsChild
                        ? document.querySelector(`[onclick*="'settings'"],[onclick*='"settings"']`)
                        : document.querySelector(`[onclick*="'${page}'"],[onclick*='"${page}"']`);
                    switchUI(trigger, page);
                    if(page === 'canvas' && event.data.openTrash) {
                        const frame = document.getElementById('frame-canvas');
                        const openTrash = () => {
                            try { frame?.contentWindow?.postMessage({ type:'studio-open-trash' }, '*'); } catch(e) {}
                        };
                        if(frame && !isCanvasListFrame(frame)) {
                            frame.addEventListener('load', openTrash, { once:true });
                            frame.src = canvasListFrameUrl();
                        } else {
                            setTimeout(openTrash, 80);
                            setTimeout(openTrash, 240);
                        }
                    }
                }
                return;
            }
            if(event.data?.type === 'studio-set-theme') {
                const theme = event.data.theme === 'dark' ? 'dark' : 'light';
                broadcastTheme(theme, { color:event.data.color });
                return;
            }
            if(event.data?.type === 'studio-set-frame-opacity') {
                broadcastFrameOpacity(event.data.opacity);
                return;
            }
            if(event.data?.type === 'studio-set-language') {
                if(window.StudioI18n) {
                    window.StudioI18n.set(event.data.lang === 'en' ? 'en' : 'zh');
                    document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
                    updateProjectUpdateTitle();
                    refreshUpdateButtonText();
                    refreshProjectUpdateModalText();
                }
                return;
            }
            if(event.data?.type === 'studio-settings-action') {
                if(event.data.action === 'toggle-theme') toggleTheme();
                if(event.data.action === 'toggle-language') toggleLanguage();
                return;
            }
            if(event.data?.type === 'studio-workflow-nav-closed') {
                setStudioNavActive('canvas');
                return;
            }
            if(event.data?.type === 'studio-workflow-nav-opened') {
                setStudioNavActive('workflow');
                return;
            }
            if(event.data?.type === 'studio-request-open-workflow-nav') {
                openWorkflowNavigation(document.getElementById('workflow-nav-entry'), { project:event.data.project });
                return;
            }
            forwardStudioApiChange(event.data);
        });

        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.onmessage = event => forwardStudioApiChange(event.data);
        } catch(e) {}

        // 2026-10-14（用户要求「两个页面共用同款侧边按钮」）：独立画布页的快捷导航跳回首页时
        // 带 ?page=<id>（可选 &nav=workflow 展开工作流导航）。URL 参数优先于 localStorage 记忆，
        // 应用后立即清掉地址栏参数，避免用户随后手动切页刷新时又被拽回该页。
        function bootPageFromUrl() {
            try {
                const params = new URLSearchParams(location.search);
                const p = params.get('page') || params.get('ui');
                return PAGE_IDS.includes(p) ? p : '';
            } catch(e) { return ''; }
        }
        function bootNavFromUrl() {
            try {
                const params = new URLSearchParams(location.search);
                const nav = params.get('nav') || params.get('openWorkflowNav') || '';
                return (nav === 'workflow' || nav === '1') ? 'workflow' : '';
            } catch(e) { return ''; }
        }

        function restoreActivePage() {
            restoreSidebarPinned();
            const urlPage = bootPageFromUrl();
            const urlNav = bootNavFromUrl();
            const stored = localStorage.getItem(ACTIVE_PAGE_KEY);
            const id = urlPage || (PAGE_IDS.includes(stored) ? stored : DEFAULT_PAGE_ID);
            restoreLocalNav(id);
            restoreSidebarSettings(id);
            const trigger = document.querySelector(`[onclick*="'${id}'"],[onclick*='"${id}"']`);
            switchUI(trigger, id, { skipRemember:true });
            document.documentElement.classList.remove('studio-route-booting');
            if (urlPage || urlNav) {
                try { history.replaceState(null, '', location.pathname); } catch(e) {}
            }
            if (urlNav === 'workflow') {
                setTimeout(() => {
                    try { openWorkflowNavigation(document.getElementById('workflow-nav-entry')); } catch(e) {}
                }, 80);
            }
        }
        document.addEventListener('DOMContentLoaded', restoreActivePage, { once:true });

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const logoDot = document.getElementById('logo-dot');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor?.classList.add('is-busy');
                    if (queueVal) queueVal.innerText = `${pos}/${total}`;
                    if (logoDot) logoDot.style.backgroundColor = '#3b82f6';
                } else {
                    monitor?.classList.remove('is-busy');
                    if (queueVal) queueVal.innerText = total > 0 ? total : '0';
                    if (logoDot) logoDot.style.backgroundColor = 'var(--text)';
                }
            } catch (e) { }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    const ov = document.getElementById('online-val');
                    if (ov) ov.innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'canvas_updated') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'asset_library_updated') {
                    document.querySelectorAll('iframe').forEach(iframe => {
                        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                    });
                }
            };
            setInterval(syncStatus, 2000);
        }

        // --- 夜间模式 ---

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || {get: () => 'light'}).get();
            const color = (window.StudioTheme || {color: () => '#f4f4f4'}).color();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme, color }, '*');
                }
            } catch (e) {}
        }

        function syncScaleToFrame(iframe) {
            const mode = (window.StudioScale || {getMode: () => 'auto'}).getMode();
            const cssScale = Number(getComputedStyle(document.documentElement).getPropertyValue('--studio-ui-scale'));
            const scale = Number.isFinite(cssScale) && cssScale > 0 ? cssScale : ((window.StudioScale || {getScale: () => 1}).getScale());
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-ui-scale', mode, scale }, '*');
                }
            } catch (e) {}
        }

        function normalizedFrameOpacity(value) {
            if(value === null || value === undefined || value === '') return 0.56;
            const next = Number(value);
            const safe = Number.isFinite(next) ? next : 0.56;
            return Math.round(Math.max(0, Math.min(0.85, safe)) * 100) / 100;
        }

        function currentFrameOpacity() {
            try {
                const stored = localStorage.getItem('smart_canvas_frame_opacity');
                return stored === null ? 0.56 : normalizedFrameOpacity(stored);
            } catch(e) {
                return 0.56;
            }
        }

        function syncFrameOpacityToFrame(iframe) {
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-frame-opacity', opacity: currentFrameOpacity() }, '*');
                }
            } catch (e) {}
        }

        function pauseScaleInFrame(frame, duration = 650) {
            try {
                frame?.contentWindow?.postMessage({ type:'studio-ui-scale-pause', duration }, '*');
            } catch(e) {}
        }

        function pauseScaleInFrames(duration = 650) {
            document.querySelectorAll('iframe').forEach(frame => pauseScaleInFrame(frame, duration));
        }

        function broadcastScaleToFrames() {
            document.querySelectorAll('iframe').forEach(frame => syncScaleToFrame(frame));
        }

        function broadcastFrameOpacity(opacity) {
            const next = normalizedFrameOpacity(opacity);
            try { localStorage.setItem('smart_canvas_frame_opacity', String(next)); } catch(e) {}
            document.querySelectorAll('iframe').forEach(frame => syncFrameOpacityToFrame(frame));
        }

        function broadcastTheme(theme, options = {}) {
            const next = theme === 'dark' ? 'dark' : 'light';
            if (window.StudioTheme) {
                window.StudioTheme.set(next, options);
            }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeDock(next);
        }

        function updateThemeDock(theme) {
            const next = theme === 'dark' ? 'dark' : 'light';
            const btn = document.getElementById('theme-toggle-btn');
            if(!btn) return;
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
            btn.setAttribute('title', next === 'dark' ? '当前深色，点击切换浅色' : '当前浅色，点击切换深色');
            btn.setAttribute('aria-label', next === 'dark' ? '当前深色，点击切换浅色' : '当前浅色，点击切换深色');
            btn.querySelectorAll('[data-theme-icon]').forEach(icon => {
                icon.style.display = icon.dataset.themeIcon === next ? 'block' : 'none';
            });
            const label = btn.querySelector('[data-theme-label]');
            if(label) label.textContent = next === 'dark' ? '深色' : '浅色';
        }

        function setThemeMode(theme) {
            broadcastTheme(theme === 'dark' ? 'dark' : 'light');
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        function toggleLanguage() {
            if(!window.StudioI18n) return;
            window.StudioI18n.toggle();
            document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
            updateProjectUpdateTitle();
            refreshUpdateButtonText();
            refreshProjectUpdateModalText();
        }

        function syncLanguageToFrame(frame) {
            if(!window.StudioI18n) return;
            try {
                frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
            } catch(e) {}
        }

        function broadcastLanguage() {
            document.querySelectorAll('iframe').forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
                } catch(e) {}
            });
        }

        // listen for theme changes triggered by theme.js
        window.addEventListener('studio-theme-change', (e) => {
            updateThemeDock(e.detail.theme);
        });

        window.addEventListener('studio-ui-scale-change', () => {
            broadcastScaleToFrames();
        });

        // init icon state on load
        window.addEventListener('DOMContentLoaded', () => {
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'light';
            updateThemeDock(theme);
            if(window.StudioI18n) window.StudioI18n.apply();
            broadcastLanguage();
            const sidebar = document.getElementById('studioSidebar');
            if(sidebar) {
                sidebar.addEventListener('mouseenter', () => pauseScaleInFrames());
                sidebar.addEventListener('mouseleave', () => pauseScaleInFrames());
            }
            checkForUpdates();

        function versionParts(value) {
            return String(value || '').match(/\d+/g)?.map(Number) || [];
        }

        function compareVersions(a, b) {
            const aa = versionParts(a);
            const bb = versionParts(b);
            const len = Math.max(aa.length, bb.length);
            for(let i = 0; i < len; i++){
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if(diff) return diff;
            }
            return String(a || '').trim() === String(b || '').trim() ? 0 : 1;
        }

        function compactVersion(value) {
            const text = String(value || '').trim();
            const parts = text.match(/\d+/g) || [];
            if(/^V/i.test(text)) {
                // 2026-10-15 新命名 V<年2位>.<月>.<日>.<当日序号>：短显去年份段 → V10.14.1
                const m = text.match(/^v\d{1,2}\.(\d{1,2})\.(\d{1,2})\.(\d+)$/i);
                if(m) return `V${m[1].padStart(2,'0')}.${m[2].padStart(2,'0')}.${m[3]}`;
                return text.toUpperCase();
            }
            if(parts.length >= 3 && /^20\d{2}[._-]\d{1,2}[._-]\d{1,2}/.test(text)) return `${parts[0]}.${String(parts[1]).padStart(2,'0')}.${String(parts[2]).padStart(2,'0')}`;
            return text.replace(/^v/i, '') || '-';
        }

        function versionLabel(value, mode = 'full') {
            const text = String(value || '').trim();
            if(!text) return 'V-';
            // 2026-10-15 修复：compact 模式此前对带 V 前缀的串直接返回全文（全串塞进 52px 胶囊被裁成「6.10.14」）
            if(/^V/i.test(text)) return mode === 'compact' ? compactVersion(text) : text.toUpperCase();
            return mode === 'compact' ? `V${compactVersion(text)}` : `V${text.replace(/^v/i, '')}`;
        }

        /* 2026-10-15 侧栏版本徽章防裁兜底：
           浏览器「最小字号」设置（中文环境常见 12px）会把 8px 的版本号强制抬高，
           8 字符在 46px 宽的侧栏里装不下，徽章两端被裁（用户截图）。
           侧栏物理宽度不够、不能靠撑开解决，改为按溢出比例整体缩放文字。
           正常环境 need ≤ avail → 缩放恒为 1，显示与之前完全一致。 */
        function fitProjectVersionBadge() {
            const badge = document.getElementById('project-version-badge');
            if(!badge) return;
            const span = badge.querySelector('.project-version-compact');
            if(!span) { badge.style.removeProperty('--badge-fit-scale'); return; }
            const cs = getComputedStyle(badge);
            const avail = badge.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
            if(!(avail > 0)) return;
            badge.style.setProperty('--badge-fit-scale', '1');
            const need = Math.max(span.scrollWidth || 0, Math.ceil(span.getBoundingClientRect().width));
            if(need > avail + 0.5) {
                const scale = Math.max(0.55, (avail - 0.5) / need);
                badge.style.setProperty('--badge-fit-scale', scale.toFixed(3));
            }
        }
        window.addEventListener('resize', () => { try { fitProjectVersionBadge(); } catch(e) {} }, { passive: true });

        function sourceConnectivityStats(source, results = []) {
            const sourceItems = (results || []).filter(item => item.source === source);
            const required = sourceItems.filter(item => item.required);
            // 无 required 项的源（如 GitHub 可选源）：按自身全部探测结果判定，而非恒判不可用
            const okRequired = required.length ? required.every(item => item.ok)
                : (sourceItems.length ? sourceItems.every(item => item.ok) : false);
            const okItems = sourceItems.filter(item => item.ok);
            const avg = okItems.length
                ? Math.round(okItems.reduce((sum, item) => sum + Number(item.elapsed_ms || 0), 0) / okItems.length)
                : 999999;
            return {source, ok:okRequired, avg, okItems:okItems.length, total:sourceItems.length};
        }

            if(sourceConnectivityStats('github', results).ok) return 'github';

        function renderConnectivityList(results = []) {

                const indicator = document.createElement('span');

                const meta = document.createElement('div');
                const name = document.createElement('div');
                name.className = 'connectivity-name';
                name.textContent = updateTargetLabel(item.name) + (item.mirror ? `（${item.mirror}）` : '');
                const url = document.createElement('div');
                url.className = 'connectivity-url';
                url.textContent = item.url || '';
                meta.append(name, url);

                status.className = 'connectivity-status';
                status.textContent = item.untouched ? updateUiText('待测试', 'Not tested') : updateStatusLabel(item);

                    error.className = 'connectivity-error';
                    error.textContent = String(item.error).slice(0, 220);
                    row.append(error);
                }
                list.append(row);

        function computeConnectivitySources(results) {
            const out = {};
            for(const source of ['modelscope', 'github']) {
                const reqAll = (results || []).filter(it => it.source === source && it.required);
                out[source] = {
                    ok: reqAll.length > 0 && reqAll.every(it => it.ok),

        function renderSourceBadgesLive(results) {
            document.querySelectorAll('[data-update-source]').forEach(card => {
                const source = card.dataset.updateSource || 'modelscope';
                const badge = card.querySelector('.update-source-badge');
                if(!badge) return;
                const items = (results || []).filter(it => it.source === source);
                if(!items.length) return;
                const done = items.filter(it => !it.pending && !it.untouched);
                if(done.length < items.length) {
                    setSourceBadge(badge, '', updateUiText(`检测中 ${done.length}/${items.length}`, `${done.length}/${items.length}`));
                    return;
                }
                const stats = sourceConnectivityStats(source, results);
                setSourceBadge(badge, stats.ok ? 'ok' : 'bad',
                    stats.ok ? updateUiText('可用', 'Available') : updateUiText('不可用', 'Unavailable'));
            });
        }

        let connectivityTesting = false;
        async function runUpdateConnectivityTest() {
            if(connectivityTesting) return; // 防止重复点击导致状态错乱
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('connectivity-test-btn');
            const text = document.getElementById('connectivity-test-text');
            connectivityTesting = true;
            if(btn) btn.disabled = true;
            if(text) text.textContent = isEn ? 'Testing...' : '检测中...';
            updateConnectivityResult = null;

            const targets = updateConnectivityTargets();
            // 实时状态数组：先全部置为「检测中」，每条探测完成立即刷新对应行
            const live = targets.map(item => ({...item, pending:true, untouched:false}));
            let backendMissing = false;
            const applyResult = (name, patch) => {
                const i = live.findIndex(x => x.name === name);
                if(i < 0) return;
                live[i] = {...live[i], pending:false, untouched:false, ...patch};
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
            };

            const probeOne = async (t) => {
                // 客户端兜底超时：5s 探测 + 1s 网络余量，超时即报「超时」，不会永远卡在「检测中」
                const ac = new AbortController();
                const killer = setTimeout(() => ac.abort(), 6000);
                try {
                    const res = await fetch(`/api/update-connectivity/probe?name=${encodeURIComponent(t.name)}`, { cache:'no-store', signal:ac.signal });
                    const data = await res.json().catch(() => ({}));
                    // 旧后端没有单条探测接口 → 404 Not Found，标记后回退到整体接口
                    if(res.status === 404 && (data.detail === 'Not Found' || data.detail === undefined)) {
                        backendMissing = true;
                        return;
                    }
                    if(res.ok) {
                        applyResult(t.name, { ok:!!data.ok, status:data.status || 0, elapsed_ms:data.elapsed_ms || 0, error:data.error || '', timed_out:!!data.timed_out });
                    } else {
                        applyResult(t.name, { ok:false, error:data.detail || (isEn ? 'Failed' : '失败') });
                    }
                } catch(e) {
                    if(e && e.name === 'AbortError') {
                        applyResult(t.name, { ok:false, timed_out:true, error:isEn ? 'Timed out (over 5s)' : '连接超时（超过 5s）' });
                    } else {
                        applyResult(t.name, { ok:false, error:describeNetworkError(e, isEn) });
                    }
                } finally {
                    clearTimeout(killer);
                }
            };

            try {
                setUpdateSummary('warn', isEn ? 'Testing connectivity' : '正在测试连通性', isEn ? 'Probing each endpoint — results stream in live.' : '正在逐条检测各节点，结果实时显示。');
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
                await Promise.all(targets.map(probeOne));

                if(backendMissing) {
                    // 兜底：尝试旧的整体接口
                    try {
                        const res = await fetch('/api/update-connectivity', { cache:'no-store' });
                        const data = await res.json().catch(() => ({}));
                        if(res.ok && Array.isArray(data.results)) {
                            updateConnectivityResult = data;
                            setUpdateSource(bestUpdateSourceFromConnectivity(data));
                            return;
                        }
                    } catch(e) {}
                    const message = isEn
                        ? 'The backend has not loaded the new connectivity-test API yet. Restart the backend service, then test again.'
                        : '后端还没有加载新的连通性测试接口。请重启服务后再测试。';
                    updateConnectivityResult = {
                        ok:false,
                        backend_missing:true,
                        results:targets.map(item => ({...item, ok:false, elapsed_ms:0, error:message })),
                    };
                    return;
                }

                const results = live.map(({pending, untouched, ...rest}) => rest);
                const sources = computeConnectivitySources(results);
                updateConnectivityResult = { results, sources, ok:sources.modelscope.ok || sources.github.ok };
                setUpdateSource(bestUpdateSourceFromConnectivity(updateConnectivityResult));
            } finally {
                connectivityTesting = false;
                if(btn) btn.disabled = false;
                refreshProjectUpdateModalText();
            }
        }

        async function confirmProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('update-now-btn');
            const text = document.getElementById('update-now-text');
            const confirmBtn = document.getElementById('project-update-confirm-btn');
            const confirmText = document.getElementById('project-update-confirm-text');
            const testBtn = document.getElementById('connectivity-test-btn');
            const oldText = text?.textContent || '';
            projectUpdateRunning = true;
            if(btn) btn.disabled = true;
            if(confirmBtn) confirmBtn.disabled = true;
            if(testBtn) testBtn.disabled = true;
            if(text) text.textContent = isEn ? 'Updating...' : '更新中...';
            if(confirmText) confirmText.textContent = isEn ? 'Updating...' : '更新中...';
            const sourceName = updateSourceLabel();
            setUpdateSummary('warn', isEn ? 'Updating' : '正在更新', isEn ? `Downloading files from ${sourceName} and creating a local backup.` : `正在从 ${sourceName} 下载文件，并创建本地备份。`);
            // 客户端兜底超时：即使后端异常挂起，UI 也能恢复，不会永远停在「更新中」
            const ac = new AbortController();
            const killer = setTimeout(() => ac.abort(), 300000);
            try {
                const res = await fetch('/api/update-from-github', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ auto_restart:true, restart_delay:3, source:updateSource, fallback:true }),
                    signal:ac.signal
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Update failed' : '更新失败'));
                if(data.update_notes) setProjectUpdateNotes(data.update_notes);
                const restarting = data.restart_scheduled;
                const fallbackNote = '';
                setUpdateSummary(
                    'ok',
                    isEn ? 'Update complete' : '更新完成',
                    (restarting
                        ? (isEn
                            ? `Updated ${data.count || 0} files. The backend will restart in about 3 seconds; this page will reload when it returns.`
                            : `已更新 ${data.count || 0} 个文件。后端将在约 3 秒后自动重启，本页面会在恢复后自动刷新。`)
                        : (isEn
                            ? `Updated ${data.count || 0} files. Please restart the backend, then refresh this page.`
                            : `已更新 ${data.count || 0} 个文件。请重启后端，然后刷新页面。`)) + fallbackNote
                );
                document.getElementById('github-entry-btn')?.classList.remove('update-available');
                clearUpdateNotice();
                btn?.classList.remove('show');
                setProjectVersionBadge(data.version || document.getElementById('github-entry-btn')?.dataset.remoteVersion || appInfo.version);
                if(restarting) waitForBackendAndReload();
            } catch(e) {
                const msg = (e && e.name === 'AbortError')
                    ? (isEn ? 'Update timed out. Switch source or check your network, then retry.' : '更新超时。请切换下载源或检查网络后重试。')
                    : describeNetworkError(e, isEn);
                setUpdateSummary('fail', isEn ? 'Update failed' : '更新失败', msg);
            } finally {
                clearTimeout(killer);
                projectUpdateRunning = false;
                if(btn) btn.disabled = false;
                if(confirmBtn) confirmBtn.disabled = false;
                if(testBtn) testBtn.disabled = false;
                if(text) text.textContent = oldText || (isEn ? 'Update' : '一键更新');
                if(confirmText) confirmText.textContent = isEn ? 'Start update' : '开始更新';
                refreshUpdateButtonText();
            }
        }
        async function waitForBackendAndReload() {
            const deadline = Date.now() + 90 * 1000;
            await new Promise(r => setTimeout(r, 4000));
            while(Date.now() < deadline) {
                try {
                    const r = await fetch('/api/app-info', { cache:'no-store' });
                    if(r.ok) { location.reload(); return; }
                } catch {}
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        async function rollbackProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            try {
                const list = await fetch('/api/update-backups').then(r => r.json());
                const backups = list.backups || [];
                if(!backups.length){ alert(isEn ? 'No backups available.' : '没有可用的备份'); return; }
                const lines = backups.slice(0, 8).map((b, i) => {
                    const d = new Date((b.created_at || 0) * 1000);
                    const ts = d.toLocaleString();
                    return `${i + 1}. ${b.name}  (${b.file_count} files, ${ts})`;
                });
                const promptMsg = (isEn
                    ? 'Select a backup to restore (enter the number):\n'
                    : '选择要还原的备份（输入序号）：\n') + lines.join('\n');
                const answer = prompt(promptMsg, '1');
                const idx = Number(answer) - 1;
                if(!(idx >= 0 && idx < backups.length)) return;
                const target = backups[idx];
                if(!confirm(isEn ? `Restore "${target.name}"? Backend will restart.` : `要还原 "${target.name}" 吗？后端会自动重启。`)) return;
                const res = await fetch('/api/update-rollback', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ name:target.name, auto_restart:true, restart_delay:3 })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Rollback failed' : '回滚失败'));
                alert(isEn
                    ? `Restored ${data.count || 0} files. Backend is restarting.`
                    : `已还原 ${data.count || 0} 个文件。后端正在重启。`);
                if(data.restart_scheduled) waitForBackendAndReload();
            } catch(e) {
                alert((isEn ? 'Rollback failed: ' : '回滚失败：') + describeNetworkError(e, isEn));
            }
        }
        window.rollbackProjectUpdate = rollbackProjectUpdate;

        async function checkForUpdates(manual = false) {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const badge = document.getElementById('project-version-badge');
            if(manual && badge) badge.classList.add('checking');
            try {
                await refreshAppInfo();
                let current = String(appInfo.version || '').trim();
                setProjectVersionBadge(current);
                let best = null;
                let reachable = false;
                let serverChecked = false;
                // 优先走后端检测：同时探测魔搭社区与 GitHub 两个远程发布源
                try {
                    const r = await fetch('/api/check-update', { cache:'no-store' });
                    if(r.ok) {
                        const d = await r.json();
                        serverChecked = true;
                        reachable = !!d.reachable;
                        if(d.current) { current = String(d.current).trim(); setProjectVersionBadge(current); }
                        if(d.latest?.version) best = {source:d.latest.source, version:d.latest.version, update_notes:d.latest.update_notes || d.update_notes || null};
                    }
                } catch(e) {}
                // 兜底：旧后端无 /api/check-update 时，浏览器直接拉取 GitHub 上的 VERSION
                if(!serverChecked) {
                    const sources = appInfo.sources || {};
                    const candidates = [
                        {source:'github', url:sources.github?.version_url || 'https://raw.githubusercontent.com/denghang6688/GBZ-Canvas/main/VERSION'},
                    ].filter(item => item.url);
                    for(const item of candidates) {
                        try {
                            const remoteText = await fetch(`${item.url}${item.url.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache:'no-store' }).then(r => r.ok ? r.text() : '');
                            const remote = String(remoteText || '').trim().split(/\r?\n/)[0].trim();
                            if(remote && !remote.includes('<') && !remote.includes('{')){ reachable = true; if(!best || compareVersions(remote, best.version) > 0) best = {source:item.source, version:remote}; }
                        } catch(e) {}
                    }
                }
                const hasUpdate = !!(current && best?.version && compareVersions(best.version, current) > 0);
                if(hasUpdate) {
                    if(best.source) setUpdateSource(best.source);
                    setProjectUpdateNotes(best.update_notes || null);
                    showUpdateNotice(current, best.version);
                } else if(manual) {
                    clearUpdateNotice();
                    setProjectVersionBadge(current);
                }
                if(manual) {
                    if(hasUpdate) {
                        openProjectUpdateModal();
                    } else if(reachable) {
                        alert(isEn ? `You are on the latest version (${versionLabel(current)}).` : `已是最新版本（${versionLabel(current)}）。`);
                    } else {
                        alert(isEn ? 'Could not reach the update sources (ModelScope / GitHub). Check your network or proxy, then try again.' : '无法连接更新源（魔搭社区 / GitHub）。请检查网络或代理后重试。');
                    }
                }
            } catch(e) {
                // 离线包里没有网络时保持安静，不影响本地使用。
                if(manual) alert(isEn ? 'Update check failed.' : '检测更新失败。');
            } finally {
                if(badge) badge.classList.remove('checking');
            }
        }
    </script>
